name: Deploy Pre-built .so

on:
  workflow_dispatch:

env:
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  RPC: https://api.devnet.solana.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "Installed: $(/tmp/solana-release/bin/solana --version)"

      - name: Write deploy keypair
        env:
          DEPLOY_KEYPAIR: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("DEPLOY_KEYPAIR", "").strip()
          raw = None
          # Try base58 (88 chars)
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          # Try base64
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64: raw = None
              except: raw = None
          # Try JSON array [1,2,3,...]
          if raw is None:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      raw = bytes(int(x) if isinstance(x, int) else x for x in arr)
              except: pass
          if raw is None:
              print(f"ERROR: cannot decode wallet secret (len={len(secret)}, first chars: {secret[:20]})")
              exit(1)
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ""
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet pubkey: {addr}")
          PYEOF
          chmod 600 /tmp/wallet.json
          /tmp/solana-release/bin/solana-keygen pubkey /tmp/wallet.json

      - name: Deploy pre-built .so
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --program-id $PROGRAM_ID \
            --url $RPC 2>&1

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url $RPC
