name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Installing Solana..."
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          echo "Solana installed"
      - run: |
          echo "Installing Rust..." && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          echo "Installing Anchor CLI (compiling from source, no GLIBC dependency)..."
          cargo install anchor-cli --version 1.0.0
          anchor --version
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        timeout-minutes: 25
      - run: export PATH="/home/runner/.cargo/bin:$PATH" && export SBF_OUT_DIR="/tmp/solana-release/sdk" && anchor build
        timeout-minutes: 15
      - run: |
          export PATH="/home/runner/.cargo/bin:/tmp/solana-release/bin:$PATH"
          echo "Deploying..."
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet || echo "Deploy done"
        timeout-minutes: 10
