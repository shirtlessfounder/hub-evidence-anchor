name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Installing Solana..."
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          echo "Solana installed"
      - run: |
          echo "Installing Anchor 1.0.0..."
          curl -L --fail "https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor && mv /tmp/anchor ~/.cargo/bin/anchor && anchor --version
      - run: |
          export SBF_OUT_DIR="/tmp/solana-release/sdk"
          anchor build
        timeout-minutes: 15
      - run: |
          echo "Deploying..."
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet || echo "Deploy done"
        timeout-minutes: 10
