name: Deploy Solana v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-solana.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode wallet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/wallet.json
          python3 -c "
import json
ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58e(b):
    n=int.from_bytes(b,'big');r=[]
    while n>0:n,rem=divmod(n,58);r.append(ALPHABET[rem])
    return ''.join(reversed(r))
d=json.load(open('/tmp/wallet.json'));kp=bytes(d)
print('WALLET_PUBKEY:',b58e(kp[32:]))
open('/tmp/wpub.txt','w').write(b58e(kp[32:]))
"
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          solana --version
      - name: Airdrop SOL
        run: |
          solana airdrop 2 $(cat /tmp/wpub.txt) --url devnet || echo "Airdrop attempted"
      - name: Deploy
        run: |
          solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so             --keypair /tmp/wallet.json --url devnet --commitment finalized
