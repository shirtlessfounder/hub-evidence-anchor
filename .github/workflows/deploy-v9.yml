name: Deploy v9 to Devnet
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save deploy keypair (base64)
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" > /tmp/encoded.txt && python3 -c "import base64;kb=base64.b64decode(open('/tmp/encoded.txt').read().strip());open('/tmp/deploy-keypair.json','wb').write(kb);print('Keypair:',len(kb),'bytes')"

      - name: Save deploy keypair (base58 fallback)
        if: failure()
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" > /tmp/encoded.txt && python3 -c "ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';n=0;exec(\"for c in open('/tmp/encoded.txt').read().strip(): n=n*58+ALPHABET.index(c)\");r=[];exec(\"while n>0:r.insert(0,n&255);n>>=8\");kb=bytes(r);open('/tmp/deploy-keypair.json','wb').write(kb);print('Keypair:',len(kb),'bytes')"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Install Anchor CLI
        run: |
          curl -L "https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor && mv /tmp/anchor ~/.cargo/bin/anchor
          anchor --version

      - name: Setup program keypair for anchor build
        run: |
          mkdir -p target/deploy
          cp /tmp/deploy-keypair.json target/deploy/hub_evidence_anchor-keypair.json
          echo "Program keypair ready: $(solana-keygen pubkey target/deploy/hub_evidence_anchor-keypair.json)"

      - name: Build
        run: anchor build

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          /tmp/solana-release/bin/solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: /tmp/solana-release/bin/solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet
