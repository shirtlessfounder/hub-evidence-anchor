name: Deploy v7 to Devnet
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${ANCHOR_WALLET_JSON}" | python3 scripts/save-wallet.py > /tmp/deploy-keypair.json
          echo "Keypair saved: $(wc -c < /tmp/deploy-keypair.json) bytes"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          V="1.0.0"  # Hardcoded — API calls timeout in GitHub Actions
          ASSET="anchor-${V}-x86_64-unknown-linux-gnu"
          curl -L "https://github.com/solana-foundation/anchor/releases/download/v${V}/${ASSET}" -o /tmp/anchor
          chmod +x /tmp/anchor && mv /tmp/anchor ~/.cargo/bin/anchor && anchor --version

      - name: Build
        run: anchor build

      - name: Deploy
        run: |
          solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: solana program show 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k --url devnet
