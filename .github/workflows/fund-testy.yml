name: Fund Testy Wallet

on:
  workflow_dispatch:

jobs:
  fund:
    runs-on: ubuntu-latest
    steps:
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64:
                      raw = None
              except Exception:
                  raw = None
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ''
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          PYEOF

      - name: Airdrop + Transfer to testy
        run: |
          WALLET=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $WALLET"
          for i in 1 2 3 4 5; do
            echo "Airdrop $i..."
            if /tmp/solana-release/bin/solana airdrop 1 "$WALLET" --url devnet 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            sleep 2
          done
          echo "Balance after airdrop:"
          /tmp/solana-release/bin/solana balance "$WALLET" --url devnet
          echo "Transferring 0.1 SOL to testy..."
          /tmp/solana-release/bin/solana transfer H9BoGBDxYqzwRaeT7TNUSmfXZ3SsB7vBmcKiSBd4Z55b 0.1 \
            --keypair /tmp/wallet.json --url devnet 2>&1
          echo "Done!"
          /tmp/solana-release/bin/solana balance H9BoGBDxYqzwRaeT7TNUSmfXZ3SsB7vBmcKiSBd4Z55b --url devnet
