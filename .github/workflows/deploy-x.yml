name: DEPLOY-X Pre-built .so

# DEDICATED DEPLOY WORKFLOW
# DO NOT EDIT — uses pre-built .so only
# NO anchor-cli, NO cargo build, NO BPF toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROGRAM_ID: 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$WALLET_JSON" > /tmp/key_b64.txt
          python3 -c "
import base64
data = open('/tmp/key_b64.txt').read().strip()
try:
    decoded = base64.b64decode(data)
    open('/tmp/key.json', 'wb').write(decoded)
    print(f'base64 decode OK: {len(decoded)} bytes')
except Exception as e:
    open('/tmp/key.json', 'w').write(data)
    print(f'Wrote as-is: {len(data)} bytes')

# Verify
import json
d = json.load(open('/tmp/key.json'))
print(f'Keypair array length: {len(d)}')
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/key.json \
            --url devnet

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
