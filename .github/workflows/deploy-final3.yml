name: Deploy Final v3 to Devnet
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save deploy keypair (base64)
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" > /tmp/encoded.txt && python3 -c "import base64;kb=base64.b64decode(open('/tmp/encoded.txt').read().strip());open('/tmp/deploy-keypair.json','wb').write(kb);print('Keypair:',len(kb),'bytes')"

      - name: Install Solana CLI + BPF toolchain
        run: |
          curl -sSfL https://release.solana.com/stable/install -o /tmp/install.sh
          chmod +x /tmp/install.sh
          /tmp/install.sh 1.18.6
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          ~/.local/share/solana/install/active_release/bin/solana-install add bpf-tools
          solana --version

      - name: Install Anchor CLI
        run: |
          curl -L "https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor && mv /tmp/anchor ~/.cargo/bin/anchor
          anchor --version

      - name: Build
        run: anchor build

      - name: Deploy
        run: |
          solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: solana program show 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k --url devnet
