name: deploy-q

on:
  workflow_dispatch: {}

env:
  PROGRAM_ID: 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet (try all formats)
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$WALLET_JSON" > /tmp/wallet_raw.txt
          python3 -c "
import json, base64
data = open('/tmp/wallet_raw.txt').read().strip()
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
# Try JSON array [1,2,...]
try:
    arr = json.loads(data)
    if isinstance(arr, list):
        open('/tmp/wallet.json','w').write(json.dumps(arr))
        print('JSON array:', len(arr), 'bytes')
        exit(0)
except: pass
# Try base64 encoded
try:
    raw = base64.b64decode(data)
    if len(raw) == 64:
        open('/tmp/wallet.json','w').write(json.dumps(list(raw)))
        print('base64:', len(raw), 'bytes')
        exit(0)
except: pass
# Try base58 encoded
try:
    n = 0
    for c in data:
        if c not in ALPHABET: raise ValueError('not base58')
        n = n * 58 + ALPHABET.index(c)
    raw = n.to_bytes(64, 'big')
    open('/tmp/wallet.json','w').write(json.dumps(list(raw)))
    print('base58:', len(raw), 'bytes')
except Exception as e:
    print('Error:', e)
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --url devnet

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
