name: deploy-q

on:
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$WALLET_JSON" | base64 -d > /tmp/wallet.bin
          python3 -c "import json; data=open('/tmp/wallet.bin','rb').read(); open('/tmp/wallet.json','w').write(json.dumps(list(data))); print(len(data))"
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so --keypair /tmp/wallet.json --url devnet
      - name: Verify
        run: /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
