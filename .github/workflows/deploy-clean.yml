name: Deploy Clean — Pre-built .so + cargo install

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROGRAM_ID: 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save deploy keypair
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 -c "
import os, base64
secret = os.environ.get('ANCHOR_WALLET_JSON', '')
kb = base64.b64decode(secret.strip())
open('/tmp/deploy-keypair.json', 'wb').write(kb)
print(f'Keypair: {len(kb)} bytes')
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Deploy pre-built .so
        run: |
          echo "Deploying from committed .so (no build needed)"
          echo ".so location: programs/hub-evidence-anchor/hub_evidence_anchor.so"
          ls -la programs/hub-evidence-anchor/hub_evidence_anchor.so
          /tmp/solana-release/bin/solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          /tmp/solana-release/bin/solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
