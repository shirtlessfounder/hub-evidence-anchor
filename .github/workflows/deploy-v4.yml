name: Deploy v4 to Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '1.18.6'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58decode(s):
    n = 0
    for c in s:
        n = n * 58 + ALPHABET.index(c)
    result = []
    while n > 0:
        result.append(n & 255)
        n >>= 8
    return bytes(result)
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = b58decode(encoded)
open('/tmp/deploy-keypair.json', 'wb').write(keypair_bytes)
print(f'Keypair saved: {len(keypair_bytes)} bytes')
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          ANCHOR_VERSION=$(curl -s https://api.github.com/repos/solana-foundation/anchor/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          ASSET="anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          curl -L "https://github.com/solana-foundation/anchor/releases/download/${ANCHOR_VERSION}/${ASSET}" -o /tmp/anchor
          chmod +x /tmp/anchor
          mv /tmp/anchor ~/.cargo/bin/anchor

      - name: Build
        run: anchor build
        timeout-minutes: 15

      - name: Deploy
        run: |
          solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet
        timeout-minutes: 10

      - name: Verify
        run: solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet
