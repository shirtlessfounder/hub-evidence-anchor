name: Deploy to Solana Devnet

on:
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: v1.18.6
  RPC: https://api.devnet.solana.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "PATH=/tmp/solana-release/bin:\$PATH" >> $GITHUB_ENV

      - name: Decode upgrade authority wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              n = 0
              for c in secret:
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
          elif secret.startswith('['):
              raw = bytes(json.loads(secret))
          else:
              raw = base64.b64decode(secret)
          with open("/tmp/wallet.json", "w") as f:
              json.dump([int(b) for b in raw], f)
          pub = raw[32:]
          n = int.from_bytes(pub, 'big')
          addr = ''
          while n > 0: n, rem = divmod(n, 58); addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/program-pubkey.txt", "w") as f:
              f.write(addr + "\n")
          PYEOF

      - name: Close stale buffers
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          echo "Closing stale buffers..."
          solana program close --buffers --keypair /tmp/wallet.json --url ${{ env.RPC }} 2>&1 || true

      - name: Request airdrop
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          echo "Balance before:"
          solana balance "$UPGRADE_AUTH" --url ${{ env.RPC }}
          
          echo ""
          echo "Requesting airdrop (10 retries, 5s apart)..."
          for i in $(seq 1 10); do
            result=$(solana airdrop 2 "$UPGRADE_AUTH" --url ${{ env.RPC }} 2>&1)
            if echo "$result" | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            echo "Airdrop $i: $(echo $result | head -1)"
            sleep 5
          done
          
          echo ""
          echo "Balance after:"
          solana balance "$UPGRADE_AUTH" --url ${{ env.RPC }}

      - name: Deploy program
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          SO_FILE="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "ERROR: No .so found at $SO_FILE"
            echo "Build the program locally and commit the .so file to git."
            echo "Or use the build-and-deploy workflow instead."
            exit 1
          fi
          
          echo "=== Bytecode ==="
          ls -lh "$SO_FILE"
          
          echo ""
          echo "=== Deploying to spJAH8 ==="
          solana program deploy \
            "$SO_FILE" \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url ${{ env.RPC }} 2>&1

      - name: Verify
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          echo "=== Program verification ==="
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url ${{ env.RPC }}
