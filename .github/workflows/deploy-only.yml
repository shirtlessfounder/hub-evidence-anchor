name: Deploy .so to Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROGRAM_ID: 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode ANCHOR_WALLET_JSON to keypair file
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/deploy-keypair.json
          python3 -c "
import json, base64
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58encode(b):
    n = int.from_bytes(b, 'big')
    r = []
    while n > 0:
        n, rem = divmod(n, 58)
        r.append(ALPHABET[rem])
    return ''.join(reversed(r))
d = json.load(open('/tmp/deploy-keypair.json'))
kp = bytes(d)
print('Keypair pubkey:', b58encode(kp[32:]))
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop devnet SOL
        run: |
          /tmp/solana-release/bin/solana airdrop 2 /tmp/deploy-keypair.json --url devnet || echo "Airdrop may have failed (already funded or rate-limited)"

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/deploy-keypair.json \
            --url devnet \
            --commitment finalized

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
