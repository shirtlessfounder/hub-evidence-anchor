name: Deploy to Solana Devnet

on:
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: v1.18.6
  RPC: https://api.devnet.solana.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "PATH=/tmp/solana-release/bin:\$PATH" >> $GITHUB_ENV

      - name: Decode upgrade authority wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          node << 'EOF'
          const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const secret = process.env.WALLET_JSON || '';
          let raw;
          if (secret.startsWith('[')) {
            raw = Buffer.from(JSON.parse(secret));
          } else if (secret.length === 88) {
            let n = 0n;
            for (const c of secret) { n = n * 58n + BigInt(ALPHABET.indexOf(c)); }
            // Convert BigInt to 64-byte big-endian buffer
            const buf = Buffer.alloc(64);
            let tmp = n;
            for (let i = 63; i >= 0; i--) {
              buf[i] = Number(tmp & 0xffn);
              tmp >>= 8n;
            }
            raw = buf;
          } else {
            raw = Buffer.from(secret, 'base64');
          }
          require('fs').writeFileSync('/tmp/wallet.json', JSON.stringify(Array.from(raw)));
          const pub = raw.slice(32);
          let n2 = 0n;
          for (const b of pub) { n2 = n2 * 256n + BigInt(b); }
          let addr = '';
          while (n2 > 0n) { const r = Number(n2 % 58n); addr = ALPHABET[r] + addr; n2 = n2 / 58n; }
          console.log('Wallet:', addr);
          require('fs').writeFileSync('/tmp/program-pubkey.txt', addr + '\n');
          EOF

      - name: Close stale buffers
        run: |
          /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url ${{ env.RPC }} 2>&1 || echo "No buffers to close"

      - name: Check balance + deploy
        run: |
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          echo "Balance before:"
          /tmp/solana-release/bin/solana balance "$UPGRADE_AUTH" --url ${{ env.RPC }}
          
          SO_FILE="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "ERROR: No .so found at $SO_FILE"
            echo "Build locally and push .so to git."
            exit 1
          fi
          
          echo "=== Bytecode ==="
          ls -lh "$SO_FILE"
          
          echo ""
          echo "=== Deploying to spJAH8 (upgrade) ==="
          /tmp/solana-release/bin/solana program deploy \
            "$SO_FILE" \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url ${{ env.RPC }} 2>&1

          echo ""
          echo "=== Final balance ==="
          /tmp/solana-release/bin/solana balance "$UPGRADE_AUTH" --url ${{ env.RPC }}

      - name: Verify
        run: |
          echo "=== Program verification ==="
          /tmp/solana-release/bin/solana account spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url ${{ env.RPC }}
