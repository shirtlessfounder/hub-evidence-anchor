name: deploy-z

on:
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
import json, base64, os
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
data = os.environ.get('WALLET_JSON', '').strip()
# Try JSON array [1,2,...]
try:
    arr = json.loads(data)
    if isinstance(arr, list):
        open('/tmp/wallet.json','w').write(json.dumps(arr))
        print('JSON array:', len(arr))
        exit(0)
except: pass
# Try base64 encoded
try:
    raw = base64.b64decode(data)
    if len(raw) == 64:
        open('/tmp/wallet.json','w').write(json.dumps(list(raw)))
        print('base64:', len(raw))
        exit(0)
except: pass
# Try base58 encoded
try:
    n = 0
    for c in data:
        if c not in ALPHABET: raise ValueError('bad char')
        n = n * 58 + ALPHABET.index(c)
    raw = n.to_bytes(64, 'big')
    open('/tmp/wallet.json','w').write(json.dumps(list(raw)))
    print('base58:', len(raw))
except Exception as e:
    print('Error:', e)
PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_ENV

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --url devnet

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
