name: Rebuild and Deploy

on:
  push:
    branches:
      - ci-clean-test
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana CLI
        run: |
          mkdir -p solana-cli
          curl -L https://github.com/solana-labs/solana/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj -C solana-cli
          echo "$GITHUB_WORKSPACE/solana-cli/solana-release/bin" >> $GITHUB_PATH

      - name: Verify PATH and cargo
        run: |
          echo "=== System PATH ==="
          echo "$PATH" | tr ':' '\n' | head -10
          echo ""
          echo "=== Which cargo? ==="
          which cargo || echo "not found in PATH"
          cargo --version || echo "cargo not available"
          echo ""
          echo "=== Rustup toolchains ==="
          rustup show
          echo ""
          echo "=== Default toolchain ==="
          rustup default

      - name: Build program
        env:
          # CRITICAL: cargo-build-sbf calls `cargo` from PATH at runtime.
          # We put Rust 1.85 cargo first in GITHUB_PATH so it's found first.
          # But cargo-build-sbf may still call the runner's cargo 1.81.
          # Workaround: put rustup cargo path FIRST in PATH, overriding system cargo.
          PATH: "$HOME/.cargo/bin:$GITHUB_WORKSPACE/solana-cli/solana-release/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        run: |
          echo "=== PATH for this step ==="
          echo "$PATH" | tr ':' '\n' | head -5
          echo ""
          echo "=== Which cargo is in PATH? ==="
          which cargo
          cargo --version
          echo ""
          echo "=== cargo-build-sbf version ==="
          cargo-build-sbf --version
          echo ""
          echo "=== Building ==="
          cargo-build-sbf 2>&1 | tee build.log
          echo ""
          echo "=== Build output ==="
          find target -name "hub_evidence_anchor.so" 2>/dev/null || echo "No .so found"
          tail -10 build.log

      - name: Deploy to devnet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
          PATH: "$HOME/.cargo/bin:$GITHUB_WORKSPACE/solana-cli/solana-release/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/deploy-keypair.json
          echo "Wallet: $(solana-keygen pubkey /tmp/deploy-keypair.json)"
          echo ""
          echo "Balance:"
          solana balance $(solana-keygen pubkey /tmp/deploy-keypair.json) --url devnet || true
          echo ""
          echo "Program:"
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet 2>/dev/null || echo "Not deployed"
          echo ""
          echo "=== Deploying ==="
          SO=$(find target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "SO: $SO"
          if [ -n "$SO" ]; then
            solana program deploy \
              --program-id /tmp/deploy-keypair.json \
              --url devnet "$SO" || echo "Deploy failed"
          fi
