name: Deploy 2026-04-07

on:
  workflow_dispatch:

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode wallet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/wallet.json
          echo "Wallet decoded: $(python3 -c "import json; d=json.load(open('/tmp/wallet.json')); print(len(d)))"
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          solana --version
      - name: Copy wallet to default location for airdrop
        run: |
          mkdir -p ~/.config/solana
          cp /tmp/wallet.json ~/.config/solana/id.json
      - name: Airdrop SOL
        run: |
          solana airdrop 2 --url devnet || echo "Airdrop failed (may be rate-limited)"
      - name: Check balances
        run: |
          echo "Default wallet:"
          solana balance --url devnet
          echo "Program ID wallet:"
          solana balance 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet || true
      - name: Deploy
        run: |
          solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --url devnet \
            --commitment finalized
      - name: Verify
        run: |
          solana program show $PROGRAM_ID --url devnet
