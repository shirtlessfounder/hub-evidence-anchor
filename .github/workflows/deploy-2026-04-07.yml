name: Deploy 2026-04-07

on:
  workflow_dispatch:

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode wallet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/wallet.json
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
      - name: Airdrop
        run: |
          WALLET=$(python3 -c "import json; d=json.load(open('/tmp/wallet.json')); kp=bytes(d); import base64; n=int.from_bytes(kp[32:],'big'); r=[]; al='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'; [r.insert(0,al[rem]) if isinstance(rem,int) else None for rem in []]; [r.insert(0,al[(n//58**(len(r)))%58]) for _ in range(10)]; print(''.join(reversed([al[n%58]]+[al[(n//58**i)%58] for i in range(1,10) if 58**i <= n])))")
          solana airdrop 2 --url devnet || true
      - name: Deploy
        run: solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so --keypair /tmp/wallet.json --url devnet
