name: Deploy 2026-04-07

on:
  workflow_dispatch:

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Save wallet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: echo "$ANCHOR_WALLET_JSON" > /tmp/wallet.json
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          tar xf /tmp/solana.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          ls /tmp/solana-release/bin/
          /tmp/solana-release/bin/solana --version
      - name: Setup wallet for airdrop
        run: |
          mkdir -p ~/.config/solana
          cp /tmp/wallet.json ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json --url devnet
      - name: Airdrop SOL
        run: solana airdrop 2 --url devnet || echo "Airdrop attempted"
      - name: Deploy
        run: |
          solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json --url devnet --commitment finalized
      - name: Verify
        run: solana program show $PROGRAM_ID --url devnet
