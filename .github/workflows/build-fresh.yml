name: Build and Deploy (fresh)

on:
  push:
    branches:
      - ci-fresh-test
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust
        run: |
          cargo --version
          rustc --version

      - name: Setup Solana CLI
        uses: metaDAOproject/setup-solana@v1
        with:
          solana-cli-version: 1.18.6

      - name: Verify Solana
        run: |
          solana --version
          cargo-build-sbf --version

      - name: Decode wallet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/deploy-keypair.json
          echo "Wallet: $(solana-keygen pubkey /tmp/deploy-keypair.json)"

      - name: Build
        run: |
          echo "Cargo: $(which cargo) $(cargo --version)"
          cargo-build-sbf 2>&1 | tee build.log
          find target -name "hub_evidence_anchor.so" 2>/dev/null

      - name: Deploy
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "Balance:"
          solana balance $(solana-keygen pubkey /tmp/deploy-keypair.json) --url devnet || true
          SO=$(find target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          if [ -n "$SO" ]; then
            solana program deploy --program-id /tmp/deploy-keypair.json --url devnet "$SO" || true
          fi
