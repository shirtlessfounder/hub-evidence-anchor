name: Fund Caller Wallet

on:
  workflow_dispatch:

jobs:
  fund:
    runs-on: ubuntu-latest
    steps:
      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64:
                      raw = None
              except Exception:
                  raw = None
          if raw is None:
              print("ERROR: cannot decode wallet secret")
              exit(1)
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ''
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet pubkey: {addr}")
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          
      - name: Fund Df8vfRCa
        run: |
          WALLET=$(cat /tmp/pubkey.txt)
          echo "Wallet: $WALLET"
          echo "Funding Df8vfRCa..."
          /tmp/solana-release/bin/solana transfer Df8vfRCaEKEZVtp5c8qmHMtnZpP1GXXVEwNayKcoW7ox 0.1 \
            --keypair /tmp/wallet.json \
            --url https://api.devnet.solana.com \
            --allow-unfunded-recipient
          echo "Done!"
          /tmp/solana-release/bin/solana balance Df8vfRCaEKEZVtp5c8qmHMtnZpP1GXXVEwNayKcoW7ox --url https://api.devnet.solana.com
