name: Rebuild and Deploy

on:
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: "1.18.6"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Install Anchor CLI (build from source — uses Solana's bundled cargo which supports SBF)
        run: |
          cargo install anchor-cli --version 1.0.0
          anchor --version

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64: raw = None
              except Exception:
                  raw = None
          if raw is None:
              print("ERROR: cannot decode wallet secret")
              exit(1)
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ''
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          PYEOF

      - name: Airdrop SOL
        run: |
          PROGRAM_PUBKEY=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $PROGRAM_PUBKEY"
          for i in 1 2 3 4 5; do
            echo "Airdrop $i..."
            if /tmp/solana-release/bin/solana airdrop 2 "$PROGRAM_PUBKEY" --url devnet 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            sleep 2
          done
          /tmp/solana-release/bin/solana balance "$PROGRAM_PUBKEY" --url devnet

      - name: Build program
        run: |
          # Delete ALL Cargo.lock files — v4 requires nightly Rust
          # Repo is double-nested: hub-evidence-anchor/hub-evidence-anchor/
          rm -f Cargo.lock
          rm -f hub-evidence-anchor/Cargo.lock
          rm -f programs/hub-evidence-anchor/Cargo.lock
          cd programs/hub-evidence-anchor
          rm -f ../Cargo.lock
          rm -f ../../Cargo.lock
          # Delete old build artifacts to force fresh compile
          rm -rf target/deploy
          anchor build 2>&1 | tail -30
          echo "=== Build artifacts ==="
          ls -la target/deploy/hub_evidence_anchor.so 2>/dev/null && echo "BUILD SUCCESS"
          grep declare_id src/lib.rs

      - name: Deploy
        run: |
          SO_PATH="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          if [ -f "$SO_PATH" ]; then
            /tmp/solana-release/bin/solana program deploy \
              "$SO_PATH" \
              --keypair /tmp/wallet.json \
              --url devnet 2>&1
          else
            echo "ERROR: .so not found at $SO_PATH"
            exit 1
          fi

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet
