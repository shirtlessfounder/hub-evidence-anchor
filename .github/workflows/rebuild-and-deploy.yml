name: Rebuild and Deploy (fix edition 2024)

on:
  workflow_dispatch:

env:
  CARGO_REGISTRY_INDEX_SPARSE_URL: https://index.crates.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify cargo version
        run: |
          cargo --version
          rustc --version

      - name: Install Solana CLI
        run: |
          mkdir -p /tmp/solana-release
          curl -L https://github.com/solana-labs/solana/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Solana CLI
        run: |
          solana --version
          cargo-build-sbf --version

      - name: Generate Cargo.lock with Rust 1.85 cargo
        run: |
          echo "=== Removing stale Cargo.lock ==="
          rm -f Cargo.lock programs/*/Cargo.lock
          echo "=== Cargo version: ==="
          cargo --version
          echo "=== Generating Cargo.lock ==="
          cargo generate-lockfile
          echo "=== Verifying cpufeatures in lockfile ==="
          grep "cpufeatures" Cargo.lock | grep "version" | sort -u

      - name: Decode wallet keypair
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/deploy-keypair.json
          echo "Wallet pubkey: $(solana-keygen pubkey /tmp/deploy-keypair.json)"

      - name: Build program
        env:
          CARGO_REGISTRY_INDEX_SPARSE_URL: https://index.crates.io
        run: |
          echo "=== Cargo version being used ==="
          which cargo
          cargo --version
          echo ""
          echo "=== cargo-build-sbf version ==="
          cargo-build-sbf --version
          echo ""
          echo "=== Building with cargo-build-sbf ==="
          cargo-build-sbf
          echo ""
          echo "=== Build output ==="
          find target -name "hub_evidence_anchor.so" -o -name "*.so" 2>/dev/null | head -5

      - name: Deploy to devnet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "=== Checking deploy wallet balance ==="
          solana-keygen pubkey /tmp/deploy-keypair.json
          solana balance $(solana-keygen pubkey /tmp/deploy-keypair.json) --url devnet
          echo ""
          echo "=== Program address ==="
          ANCHOR_PROGRAM_ID=$(grep -o '"[A-Za-z0-9]*"' Anchor.toml | head -1 | tr -d '"')
          echo "Program ID from Anchor.toml: $ANCHOR_PROGRAM_ID"
          echo ""
          echo "=== Current program state ==="
          solana program show $ANCHOR_PROGRAM_ID --url devnet 2>/dev/null || echo "Program not yet deployed"
          echo ""
          echo "=== Deploying ==="
          SO_FILE=$(find target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "Deploying: $SO_FILE"
          solana program deploy \
            --program-id /tmp/deploy-keypair.json \
            --url devnet \
            "$SO_FILE" || true
