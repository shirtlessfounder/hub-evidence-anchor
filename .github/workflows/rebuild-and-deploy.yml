name: Rebuild and Deploy (fix edition 2024)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Rust 1.85 cargo
        run: |
          cargo --version
          rustc --version

      - name: Setup Solana CLI
        uses: metadaoproject/setup-solana@v1
        with:
          solana-cli-version: 1.18.6

      - name: Verify Solana CLI
        run: |
          solana --version
          cargo-build-sbf --version

      - name: Verify Rust 1.85 cargo is first in PATH
        run: |
          which cargo
          cargo --version

      - name: Decode wallet keypair
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/deploy-keypair.json
          echo "Wallet: $(solana-keygen pubkey /tmp/deploy-keypair.json)"

      - name: Build program
        env:
          RUST_LOG: debug
        run: |
          echo "=== PATH order ==="
          echo "$PATH" | tr ':' '\n' | head -5
          echo ""
          echo "=== Which cargo ==="
          which cargo
          cargo --version
          echo ""
          echo "=== cargo-build-sbf version ==="
          cargo-build-sbf --version
          echo ""
          echo "=== Building ==="
          cargo-build-sbf 2>&1 | tee build.log
          echo ""
          echo "=== Build output ==="
          find target -name "hub_evidence_anchor.so" -o -name "*.so" 2>/dev/null | head -5
          tail -20 build.log

      - name: Deploy to devnet
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "=== Wallet balance ==="
          solana balance $(solana-keygen pubkey /tmp/deploy-keypair.json) --url devnet
          echo ""
          echo "=== Program address ==="
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet 2>/dev/null || echo "Not yet deployed"
          echo ""
          echo "=== Deploying ==="
          SO=$(find target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "SO: $SO"
          if [ -n "$SO" ]; then
            solana program deploy \
              --program-id /tmp/deploy-keypair.json \
              --url devnet "$SO" || echo "Deploy failed"
          fi
