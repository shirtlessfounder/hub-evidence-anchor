name: Rebuild and Deploy

on:
  workflow_dispatch:

env:
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  HOME: /home/runner
  # Prepend SBF cargo + Solana tools so cargo-build-sbf finds the right cargo (v1.77, v3 lockfiles)
  # Note: $HOME not shell-expanded in job env, use absolute path for symlinked cargo
  PATH: /tmp/solana-release/bin:/home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup directories for cargo-build-sbf
        run: |
          mkdir -p $HOME/.cargo/bin
          mkdir -p $HOME/.rustup
          mkdir -p $HOME/.sdk

      - name: Install Solana CLI + SBF toolchain
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Rust + SBF target
        run: |
          # Install Rust if not present
          if ! command -v cargo &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.72.0
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          rustup target add sbfv1
          echo "cargo version: $(cargo --version)"
          echo "rustc version: $(rustc --version)"

      - name: Fix program Anchor.toml with spJAH8
        run: |
          perl -i -pe 's{^(hub_evidence_anchor = ")[^"]*"}{$1spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf"}' Anchor.toml
          grep "hub_evidence_anchor" Anchor.toml

      - name: Build program
        run: |
          rm -rf target
          rm -f Cargo.lock
          rm -f programs/hub-evidence-anchor/Cargo.lock
          /tmp/solana-release/bin/cargo-build-sbf 2>&1 | tail -30
          echo "---"
          ls -la target/deploy/hub_evidence_anchor.so 2>/dev/null && echo "BUILD SUCCESS"
          strings target/deploy/hub_evidence_anchor.so | grep -E "^[1-9A-HJ-NP-Za-km-z]{32,44}$" | head -5

      - name: Decode program wallet
        env:
          PROGRAM_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("PROGRAM_WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64: raw = None
              except: raw = None
          if raw is None:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      raw = bytes(int(x) if isinstance(x, int) else x for x in arr)
              except: pass
          if raw is None: print("ERROR"); exit(1)
          with open("/tmp/program-wallet.json", "w") as f: json.dump(list(raw), f)
          npub = int.from_bytes(raw[32:], "big")
          addr = ""
          while npub > 0: npub, rem = divmod(npub, 58); addr = ALPHABET[rem] + addr
          with open("/tmp/program-pubkey.txt", "w") as f: f.write(addr)
          print(f"Wallet: {addr}")
          PYEOF

      - name: Airdrop SOL
        run: |
          PROGRAM_PUBKEY=$(cat /tmp/program-pubkey.txt)
          echo "Balance before:"
          solana balance "$PROGRAM_PUBKEY" --url https://api.devnet.solana.com
          for i in 1 2 3 4 5; do
            if solana airdrop 5 "$PROGRAM_PUBKEY" --url https://api.devnet.solana.com 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"; break
            fi
            echo "Airdrop $i failed, retry..."
            sleep 5
          done
          echo "Balance after:"
          solana balance "$PROGRAM_PUBKEY" --url https://api.devnet.solana.com

      - name: Deploy
        run: |
          PROGRAM_PUBKEY=$(cat /tmp/program-pubkey.txt)
          solana program deploy \
            target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/program-wallet.json \
            --program-id $PROGRAM_ID \
            --url devnet

      - name: Verify
        run: solana program show $PROGRAM_ID --url devnet
