name: Rebuild and Deploy

on:
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: "1.18.6"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64:
                      raw = None
              except Exception:
                  raw = None
          if raw is None:
              print("ERROR: cannot decode wallet secret")
              exit(1)
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ''
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          PYEOF

      - name: Airdrop SOL
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          PROGRAM_PUBKEY=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $PROGRAM_PUBKEY"
          for i in 1 2 3 4 5; do
            echo "Airdrop attempt $i..."
            if /tmp/solana-release/bin/solana airdrop 2 "$PROGRAM_PUBKEY" --url devnet 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            sleep 2
          done
          /tmp/solana-release/bin/solana balance "$PROGRAM_PUBKEY" --url devnet

      - name: Build + Deploy in Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v /tmp/wallet.json:/tmp/wallet.json:ro \
            -v /tmp/pubkey.txt:/tmp/pubkey.txt:ro \
            -v /tmp/solana-release:/tmp/solana-release:ro \
            -w /workspace \
            -e PATH="/tmp/solana-release/bin:$PATH" \
            solanalabs/solana:v${{ env.SOLANA_CLI_VERSION }} \
            bash -c '
              echo "Building program..."
              anchor build 2>&1 | tail -5
              
              SO_PATH="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
              if [ ! -f "$SO_PATH" ]; then
                echo "ERROR: build failed"
                exit 1
              fi
              
              echo "Built .so:"
              ls -la "$SO_PATH"
              
              echo "Verifying program ID:"
              grep declare_id programs/hub-evidence-anchor/src/lib.rs
              
              PROGRAM_PUBKEY=$(cat /tmp/pubkey.txt)
              echo "Deploying to: $PROGRAM_PUBKEY"
              
              solana program deploy \
                "$SO_PATH" \
                --keypair /tmp/wallet.json \
                --program-id "$PROGRAM_PUBKEY" \
                --url devnet 2>&1
              
              echo "Verifying:"
              solana program show "$PROGRAM_PUBKEY" --url devnet
            '

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $(cat /tmp/pubkey.txt) --url devnet
