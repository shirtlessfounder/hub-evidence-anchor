name: Rebuild and Deploy

on:
  workflow_dispatch:

env:
  SOLANA_CLI_VERSION: "1.18.6"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
              except ValueError:
                  raw = None
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64:
                      raw = None
              except Exception:
                  raw = None
          if raw is None:
              print("ERROR: cannot decode wallet secret")
              exit(1)
          with open("/tmp/wallet.json", "w") as f:
              json.dump(list(raw), f)
          pubkey_bytes = raw[32:]
          n = int.from_bytes(pubkey_bytes, "big")
          addr = ''
          while n > 0:
              n, rem = divmod(n, 58)
              addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          PYEOF

      - name: Airdrop SOL
        run: |
          /tmp/solana-release/bin/solana airdrop 2 $(cat /tmp/pubkey.txt) --url devnet || \
          /tmp/solana-release/bin/solana airdrop 1 $(cat /tmp/pubkey.txt) --url devnet || \
          /tmp/solana-release/bin/solana airdrop 0.5 $(cat /tmp/pubkey.txt) --url devnet
          /tmp/solana-release/bin/solana balance $(cat /tmp/pubkey.txt) --url devnet

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Build + Deploy in Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e "ANCHOR_WALLET_JSON=${{ secrets.ANCHOR_WALLET_JSON }}" \
            solanalabs/solana:v${{ env.SOLANA_CLI_VERSION }} \
            bash -c '
              echo "Installing Anchor CLI..."
              npm install -g @coral-xyz/anchor@0.32.1 2>&1 | tail -3
              anchor --version || echo "Anchor install check..."
              
              echo "Building program..."
              anchor build 2>&1 | tail -10
              
              echo "Built .so:"
              ls -la programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so 2>/dev/null || echo "Build failed"
              
              echo "Verifying program ID:"
              grep declare_id programs/hub-evidence-anchor/src/lib.rs
            '

      - name: Deploy (Docker built .so)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            solanalabs/solana:v${{ env.SOLANA_CLI_VERSION }} \
            bash -c '
              cp programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so /tmp/hub_evidence_anchor.so
              echo "Deploying with wallet $(cat /tmp/pubkey.txt)..."
              solana program deploy \
                /tmp/hub_evidence_anchor.so \
                --keypair /tmp/wallet.json \
                --program-id $(cat /tmp/pubkey.txt) \
                --url devnet 2>&1
              echo "Done!"
              solana program show $(cat /tmp/pubkey.txt) --url devnet
            '
