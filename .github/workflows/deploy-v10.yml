name: Deploy v10 to Devnet
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup update stable
          rustup component add rust-src

      - name: Upgrade Anchor deps to 1.0.0
        run: |
          . "$HOME/.cargo/env"
          sed -i 's/anchor-lang = { version = "0.32.1"/anchor-lang = "1.0.0"/' programs/hub-evidence-anchor/Cargo.toml
          sed -i 's/anchor-spl = { version = "0.32.1"/anchor-spl = "1.0.0"/' programs/hub-evidence-anchor/Cargo.toml
          sed -i 's/anchor_version = "0.32.1"/anchor_version = "1.0.0"/' Anchor.toml 2>/dev/null || true
          cat programs/hub-evidence-anchor/Cargo.toml | grep anchor

      - name: Save deploy keypair (base64)
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" > /tmp/encoded.txt && python3 -c "import base64;kb=base64.b64decode(open('/tmp/encoded.txt').read().strip());open('/tmp/deploy-keypair.json','wb').write(kb);print('Keypair:',len(kb),'bytes')"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Install Anchor CLI 1.0.0
        run: |
          . "$HOME/.cargo/env"
          curl -L "https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu" -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor && anchor --version

      - name: Build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$PATH"
          anchor build

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || true
          /tmp/solana-release/bin/solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: /tmp/solana-release/bin/solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet
