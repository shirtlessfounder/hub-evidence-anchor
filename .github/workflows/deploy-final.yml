name: Deploy Final (Pre-built .so)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64, sys
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58decode(s):
    n = 0
    for c in s:
        n = n * 58 + ALPHABET.index(c)
    result = []
    while n > 0:
        result.append(n & 255)
        n >>= 8
    return bytes(result)
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = b58decode(encoded)
open('target/deploy/hub_evidence_anchor-keypair.json', 'wb').write(keypair_bytes)
print(f'Keypair saved: {len(keypair_bytes)} bytes')
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> \$GITHUB_PATH
          solana --version

      - name: Deploy
        run: |
          solana program deploy \
            programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so \
            --keypair target/deploy/hub_evidence_anchor-keypair.json \
            --url devnet

      - name: Verify
        run: |
          solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet
