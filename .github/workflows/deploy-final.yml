name: deploy-final

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import json, base64

          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          secret = os.environ.get('WALLET_JSON', '').strip()
          print(f'Secret len={len(secret)}')

          raw = None

          # Try base58 decode first
          try:
              n = 0
              for c in secret:
                  if c not in ALPHABET:
                      raise ValueError('not base58')
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
              print('Format: base58 -> 64 bytes')
          except Exception as e:
              print(f'base58 failed: {e}')

          # Try base64 as fallback
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) == 64:
                      print('Format: base64 -> 64 bytes')
                  else:
                      raw = None
              except: pass

          # Try JSON array as fallback
          if raw is None:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      raw = bytes(arr)
                      print('Format: JSON array -> 64 bytes')
              except: pass

          if raw is None:
              print('ERROR: cannot decode wallet')
              exit(1)

          # Write as base58 string (solana-keygen format)
          n2 = int.from_bytes(raw, 'big')
          b58 = ''
          while n2 > 0:
              n2, rem = divmod(n2, 58)
              b58 = ALPHABET[rem] + b58
          with open('/tmp/keypair.txt', 'w') as f:
              f.write(b58)
          print(f'Written: {len(b58)}-char base58 string')

          # Extract pubkey
          pub = int.from_bytes(raw[32:], 'big')
          pubkey = ''
          while pub > 0:
              pub, rem = divmod(pub, 58)
              pubkey = ALPHABET[rem] + pubkey
          print(f'PUBKEY: {pubkey}')
          with open('/tmp/pubkey.txt', 'w') as f:
              f.write(pubkey)
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL
        run: |
          PUBKEY=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $PUBKEY"
          /tmp/solana-release/bin/solana airdrop 10 "$PUBKEY" --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/keypair.txt \
            --url devnet \
            --commitment finalized

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
