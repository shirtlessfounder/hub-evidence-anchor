name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '1.18.30'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/solana-foundation/solana-toolline:v1.18.30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = base64.b58decode(encoded)
open('/tmp/deploy-keypair.json', 'wb').write(keypair_bytes)
"

      - name: Install Rust + Anchor CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "\$HOME/.cargo/env"
          echo "PATH=\$HOME/.cargo/bin:\$PATH" >> \$GITHUB_PATH
          cargo install anchor-cli

      - name: Build
        run: |
          . "\$HOME/.cargo/env"
          anchor build

      - name: Airdrop + Deploy
        run: |
          . "\$HOME/.cargo/env"
          for endpoint in "https://api.devnet.solana.com" "https://devnet.helius-rpc.com"; do
            solana airdrop 2 --url "\$endpoint" --keypair /tmp/deploy-keypair.json && break || true
          done
          solana program deploy target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/deploy-keypair.json \
            --url devnet \
            --program-id target/deploy/hub_evidence_anchor-keypair.json

      - name: Verify
        run: |
          solana program show \$PROGRAM_ID --url devnet
