name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '1.0.0'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'
  CACHE_VERSION: 'v1'
  DEVNET_RPC: 'https://api.devnet.solana.com'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify Solana CLI
        run: |
          /tmp/solana-release/bin/solana --version
        shell: bash

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            anchor-${{ env.ANCHOR_VERSION }}-${{ env.CACHE_VERSION }}-
            anchor-${{ env.ANCHOR_VERSION }}-

      - name: Install system deps (cache miss)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev
        shell: bash

      - name: Install Rust toolchain (cache miss)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Anchor CLI (cache miss)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install anchor-cli@${ANCHOR_VERSION}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        timeout-minutes: 20
        shell: bash

      - name: Verify Anchor CLI
        run: anchor --version
        shell: bash

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64, sys
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = base64.b58decode(encoded)
open('target/deploy/hub_evidence_anchor-keypair.json', 'wb').write(keypair_bytes)
print('Keypair saved, length:', len(keypair_bytes))
"
        shell: python3

      - name: Build
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 20
        shell: bash

      - name: Airdrop SOL + Deploy
        run: |
          for endpoint in "$DEVNET_RPC" "https://devnet.helius-rpc.com/?api-key="; do
            echo "Trying airdrop from \$endpoint..."
            /tmp/solana-release/bin/solana airdrop 2 --url "\$endpoint" --keypair target/deploy/hub_evidence_anchor-keypair.json && break || true
          done
          echo "--- Deploying program ---"
          /tmp/solana-release/bin/solana program deploy target/deploy/hub_evidence_anchor.so \
            --keypair target/deploy/hub_evidence_anchor-keypair.json \
            --url $DEVNET_RPC
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 15
        shell: bash

      - name: Verify deployment
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url $DEVNET_RPC
          echo ""
          echo "✅ Program deployed!"
          echo "Program ID: $PROGRAM_ID"
          echo "Explorer: https://explorer.solana.com/address/\$PROGRAM_ID?cluster=devnet"
        env:
          PATH: /tmp/solana-release/bin:$PATH
        shell: bash
