name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_CLI_VERSION: '1.18.26'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/solana-labs/solana/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar xf solana.tar.bz2
          rm solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI (pre-built binary from GitHub releases — no compilation)
        run: |
          curl -sSfL --retry 5 \
            "https://github.com/coral-xyz/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu" \
            -o /tmp/anchor
          chmod +x /tmp/anchor
          echo "/tmp" >> $GITHUB_PATH

      - name: Build
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/lib/node_modules/.bin:$PATH
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Airdrop SOL (devnet only)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: $HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
          ANCHOR_WALLET: ${{ secrets.ANCHOR_WALLET_JSON }}

      - name: Deploy
        run: anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$HOME/lib/node_modules/.bin:$PATH
          ANCHOR_WALLET: ${{ secrets.ANCHOR_WALLET_JSON }}

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
