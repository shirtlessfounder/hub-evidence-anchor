name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode wallet keypair
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import json, base64, os

          secret = os.environ.get('WALLET_JSON', '').strip()
          print(f'Secret length: {len(secret)}')

          # Format 1: base64 of raw binary keypair -> decode -> write as-is (Solana reads raw bytes)
          try:
              raw = base64.b64decode(secret)
              if len(raw) == 64:
                  open('/tmp/keypair.bin', 'wb').write(raw)
                  print(f'Format: base64(raw 64 bytes) — write raw binary')
                  print(f'First 3 bytes: {list(raw[:3])}')
                  exit(0)
          except Exception as e:
              print(f'Format 1 failed: {e}')

          # Format 2: base64 of JSON array string -> decode UTF-8 -> parse JSON -> write JSON
          try:
              decoded_str = base64.b64decode(secret).decode('utf-8')
              arr = json.loads(decoded_str)
              if isinstance(arr, list) and len(arr) == 64:
                  with open('/tmp/keypair.json', 'w') as f:
                      json.dump(arr, f)
                  print(f'Format: base64(JSON string) -> JSON file, 64 elements')
                  print(f'First 3: {arr[:3]}')
                  exit(0)
          except Exception as e:
              print(f'Format 2 failed: {e}')

          # Format 3: plain JSON array "[1,2,...]"
          try:
              arr = json.loads(secret)
              if isinstance(arr, list) and len(arr) == 64:
                  with open('/tmp/keypair.json', 'w') as f:
                      json.dump(arr, f)
                  print(f'Format: plain JSON array -> JSON file')
                  exit(0)
          except Exception as e:
              print(f'Format 3 failed: {e}')

          print('ERROR: Could not decode wallet')
          exit(1)
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL
        run: |
          /tmp/solana-release/bin/solana airdrop 2 --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy pre-built .so
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/keypair.bin \
            --url devnet \
            --commitment finalized

      - name: Verify deployment
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
