name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROGRAM_ID: '6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = base64.b58decode(encoded)
open('/tmp/deploy-keypair.json', 'wb').write(keypair_bytes)
"

      - name: Install Solana + Rust + Anchor
        run: |
          # Solana CLI
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

          # Rust + Anchor CLI
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo install anchor-cli@1.0.0

      - name: Build
        run: |
          export SBF_OUT_DIR="/tmp/solana-release/sdk"
          echo "SBF_OUT_DIR=$SBF_OUT_DIR"
          anchor build
        timeout-minutes: 20

      - name: Airdrop SOL + Deploy
        run: |
          for endpoint in "https://api.devnet.solana.com" "https://devnet.helius-rpc.com/?api-key=" "https://solana-devnet.gateway.pokt.network/v1/labels/devnet"; do
            echo "Trying airdrop from $endpoint..."
            solana airdrop 2 --url "$endpoint" --keypair /tmp/deploy-keypair.json && echo "Airdrop success" && break || echo "Failed"
          done
          solana balance --url devnet
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet --program-id target/deploy/hub_evidence_anchor-keypair.json
        timeout-minutes: 15

      - name: Verify
        run: |
          solana program show $PROGRAM_ID --url devnet
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"
