name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_ID: '6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI + Agave SDK
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Solana CLI
        run: solana --version

      - name: Install Rust + Anchor
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo install anchor-cli --version ${ANCHOR_VERSION}

      - name: Copy program keypair
        run: |
          mkdir -p target/deploy
          cp keys/hub-evidence-anchor-keypair.json target/deploy/hub_evidence_anchor-keypair.json
          echo "Keypair: $(/tmp/solana-release/bin/solana-keygen pubkey keys/hub-evidence-anchor-keypair.json)"

      - name: Build Anchor program
        run: |
          export SBF_OUT_DIR="$PWD/solana-release/sdk"
          anchor build
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 20

      - name: Airdrop SOL + Deploy
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json
          solana airdrop 2 --url devnet
          anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json
        timeout-minutes: 15

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url devnet
        env:
          PATH: /tmp/solana-release/bin:$PATH
