name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode wallet keypair
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import json, base64, os

          secret = os.environ.get('WALLET_JSON', '').strip()
          print(f'Secret len={len(secret)}')

          decoded = False

          # Format 1: raw base64 bytes -> write binary
          try:
              raw = base64.b64decode(secret)
              if len(raw) == 64:
                  open('/tmp/keypair.json', 'wb').write(raw)
                  print('Format: raw b64 -> binary')
                  decoded = True
          except: pass

          # Format 2: b64 of JSON string -> parse -> write JSON
          if not decoded:
              try:
                  arr = json.loads(base64.b64decode(secret).decode('utf-8'))
                  if isinstance(arr, list) and len(arr) == 64:
                      with open('/tmp/keypair.json', 'w') as f:
                          json.dump(arr, f)
                      print('Format: b64(JSON) -> JSON')
                      decoded = True
              except: pass

          # Format 3: plain JSON array
          if not decoded:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      with open('/tmp/keypair.json', 'w') as f:
                          json.dump(arr, f)
                      print('Format: plain JSON array')
                      decoded = True
              except: pass

          # Format 4: base58-encoded raw 64 bytes -> decode -> write as JSON array
          if not decoded:
              try:
                  ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
                  n = 0
                  for c in secret:
                      if c not in ALPHABET:
                          raise ValueError(f'not base58: {c}')
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, 'big')
                  with open('/tmp/keypair.json', 'w') as f:
                      json.dump(list(raw), f)
                  print('Format: base58 -> JSON array')
                  decoded = True
                  # Save pubkey for airdrop
                  pubkey_bytes = raw[32:]
                  npub = int.from_bytes(pubkey_bytes, 'big')
                  pubkey = ''
                  while npub > 0:
                      npub, rem = divmod(npub, 58)
                      pubkey = ALPHABET[rem] + pubkey
                  print(f'PUBKEY: {pubkey}')
                  with open('/tmp/pubkey.txt', 'w') as f:
                      f.write(pubkey)
              except Exception as e:
                  print(f'Format 4 (base58) failed: {e}')

          if not decoded:
              print('ERROR: cannot decode wallet')
              exit(1)
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL to deploy wallet
        run: |
          PUBKEY=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $PUBKEY"
          /tmp/solana-release/bin/solana airdrop 2 "$PUBKEY" --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy pre-built .so
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/keypair.json \
            --url devnet \
            --commitment finalized

      - name: Verify deployment
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
