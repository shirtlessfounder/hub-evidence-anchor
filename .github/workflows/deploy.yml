name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '1.18.6'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = base64.b58decode(encoded)
open('/tmp/deploy-keypair.json', 'wb').write(keypair_bytes)
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI via cargo-binstall (pre-compiled, ~30 seconds)
        run: |
          curl -LsSf https://cargo.binstall.xyz/latest/install.sh | bash -s -- -y
          cargo binstall -y anchor-cli

      - name: Build
        run: anchor build
        timeout-minutes: 15

      - name: Deploy
        run: |
          for endpoint in "https://api.devnet.solana.com" "https://devnet.helius-rpc.com"; do
            solana airdrop 2 --url "$endpoint" --keypair /tmp/deploy-keypair.json && break || true
          done
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet
        timeout-minutes: 10

      - name: Verify
        run: solana program show $PROGRAM_ID --url devnet
