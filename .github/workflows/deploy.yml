name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_VERSION: '3.1.12'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/bin/solana-test-validator
          key: cargo-solana-${SOLANA_VERSION}

      - name: Install Solana CLI + Agave SDK
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Rust + Anchor CLI
        run: |
          # Install Rust if not present
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          # Install anchor-cli (pre-built binary approach)
          cargo install anchor-lang --version 1.0.0 2>/dev/null || true
          # Use npm for anchor-cli which provides pre-built binary
          npm install -g @coral-xyz/anchor-cli
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 15

      - name: Verify tools
        run: |
          solana --version
          anchor --version || anchor-cli --version

      - name: Build Anchor program
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 15

      - name: Airdrop SOL (devnet)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: /tmp/solana-release/bin:$PATH

      - name: Deploy to Solana
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json
          anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json
        timeout-minutes: 10

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
          echo "---"
          echo "Program ID: $PROGRAM_ID"
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=${{ inputs.cluster || 'devnet' }}"
        env:
          PATH: /tmp/solana-release/bin:$PATH
