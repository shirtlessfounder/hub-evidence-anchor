name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI + Agave SDK
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          # Install system deps needed for cargo install of anchor-cli
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Verify Solana CLI
        run: solana --version && solana-keygen --version

      - name: Build Anchor program
        run: |
          cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }}
          anchor build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_BUILD_JOBS: '4'
          LIBSODIUM_DEV_MAX_VERSION: '99.99.99'
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH

      - name: Airdrop SOL (devnet)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: /tmp/solana-release/bin:$PATH

      - name: Deploy to Solana
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json
          anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
          echo "---"
          echo "Program ID: $PROGRAM_ID"
          echo "Cluster: ${{ inputs.cluster || 'devnet' }}"
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=${{ inputs.cluster || 'devnet' }}"
        env:
          PATH: /tmp/solana-release/bin:$PATH
