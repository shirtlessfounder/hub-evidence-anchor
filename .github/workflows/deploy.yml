name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_CLI_VERSION: '1.18.26'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write deploy wallet
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.solana.com/stable/install -o install.sh
          chmod +x install.sh
          ./install.sh 2.0.0
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install BPF toolchain
        run: |
          solana-install add bpf-tools || echo "bpf-tools may already be installed"

      - name: Install Anchor CLI
        run: |
          curl -sSfL "https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor
          mv /tmp/anchor /usr/local/bin/anchor

      - name: Build
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Airdrop SOL (devnet only)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json

      - name: Deploy
        run: anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH
