name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_CLI_VERSION: 'v1.18.26'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/solana-labs/solana/releases/download/${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_BUILD_JOBS: '4'

      - name: Build
        run: anchor build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Airdrop SOL (devnet only)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: |
          solana airdrop 2 --url devnet
          solana balance --url devnet
        env:
          ANCHOR_WALLET: ${{ secrets.ANCHOR_WALLET_JSON }}

      - name: Deploy
        run: anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          ANCHOR_WALLET: ${{ secrets.ANCHOR_WALLET_JSON }}

      - name: Verify deployment
        run: solana program show ${{ env.PROGRAM_ID }} --url ${{ inputs.cluster || 'devnet' }}
