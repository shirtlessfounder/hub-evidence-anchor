name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '1.0.0'
  PROGRAM_ID: 6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI + Agave SDK
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Verify Solana CLI
        run: solana --version

      - name: Install Anchor CLI (pre-built binary)
        run: |
          ANCHOR_URL="https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          curl -L "$ANCHOR_URL" -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          anchor --version

      - name: Build Anchor program
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 20

      - name: Airdrop SOL + Deploy
        run: |
          solana airdrop 2 --url devnet
          anchor deploy --provider.cluster devnet
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
          ANCHOR_WALLET: ${{ secrets.ANCHOR_WALLET_JSON }}
        timeout-minutes: 15

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url devnet
        env:
          PATH: /tmp/solana-release/bin:$PATH
