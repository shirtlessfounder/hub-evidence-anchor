on:
  push:
  workflow_dispatch:

name: Deploy to Solana Devnet

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Setup Rust 1.85
        run: |
          mkdir -p /opt/cargo /opt/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 --no-modify-path

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Decode wallet
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          
          secret = os.environ.get('ANCHOR_WALLET_JSON', '').strip()
          print(f"Secret length: {len(secret)}")
          
          # Try to figure out what format the secret is in
          if len(secret) == 0:
            raise Exception("ANCHOR_WALLET_JSON is empty!")
          
          # Format 1: raw 88-char base58 keypair → base64 encoded
          # Format 2: base64 of base58 string
          # Format 3: already the raw base58 string
          
          # Try: raw base58 → bytes → base64.b64decode → base58.b58decode → 64 bytes
          try:
            # First: is the secret itself base58 (88 chars)?
            if len(secret) >= 80:
              candidate = secret[:88] if len(secret) > 88 else secret
              if all(c in '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz' for c in candidate):
                import base58
                try:
                  decoded = base58.b58decode(candidate)
                  if len(decoded) == 64:
                    print(f"Format: raw base58 ({len(decoded)} bytes)")
                    key = list(decoded)
                    with open('/tmp/wallet.json', 'w') as f:
                      json.dump(key, f)
                    print(f"Wallet written: {len(key)} elements")
                    with open('/tmp/wallet.json') as f:
                      content = f.read()
                    print(f"JSON length: {len(content)}, starts: {content[:50]}")
                    exit(0)
                except:
                  pass
          except ImportError:
            pass
          
          # Format 2: base64 encoded base58 string
          try:
            decoded = base64.b64decode(secret)
            print(f"After base64.b64decode: {len(decoded)} bytes, first byte: {decoded[0] if decoded else None}")
            
            # Try base58 decode
            import base58
            try:
              b58_decoded = base58.b58decode(decoded)
              if len(b58_decoded) == 64:
                print(f"Format: base64(base58) → {len(b58_decoded)} bytes")
                key = list(b58_decoded)
                with open('/tmp/wallet.json', 'w') as f:
                  json.dump(key, f)
                print(f"Wallet written: {len(key)} elements")
                exit(0)
            except:
              pass
              
            # Maybe it's base64 of JSON array?
            try:
              json_arr = json.loads(decoded)
              if isinstance(json_arr, list) and len(json_arr) == 64:
                print(f"Format: base64(JSON array) → {len(json_arr)} elements")
                with open('/tmp/wallet.json', 'w') as f:
                  json.dump(json_arr, f)
                exit(0)
            except:
              pass
              
            # Maybe base64 of base58 key, try treating as ASCII base58
            try:
              b58_str = decoded.decode('ascii')
              if all(c in '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz' for c in b58_str.strip()):
                import base58
                b58_bytes = base58.b58decode(b58_str.strip())
                if len(b58_bytes) == 64:
                  print(f"Format: base64(base58_str) → {len(b58_bytes)} bytes")
                  key = list(b58_bytes)
                  with open('/tmp/wallet.json', 'w') as f:
                    json.dump(key, f)
                  exit(0)
            except Exception as e:
              print(f"ASCII decode failed: {e}")
          except Exception as e:
            print(f"base64 decode failed: {e}")
          
          raise Exception("Could not decode wallet - unknown format")
          PYEOF

      - name: Check balance
        run: /tmp/solana-release/bin/solana balance --keypair /tmp/wallet.json --url devnet

      - name: Close buffers
        run: /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url devnet || true

      - name: Airdrop SOL
        run: /tmp/solana-release/bin/solana airdrop 2 --keypair /tmp/wallet.json --url devnet || echo "Airdrop done"

      - name: Generate Cargo.lock
        run: cargo +1.85 generate-lockfile 2>&1 || true

      - name: Build program
        run: /tmp/solana-release/bin/cargo-build-sbf 2>&1

      - name: Copy artifact
        run: |
          mkdir -p programs/hub-evidence-anchor/target/deploy
          cp target/sbpf-solana-solana/release/hub_evidence_anchor.so programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
          ls -lh programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so

      - name: Deploy to devnet
        run: |
          /tmp/solana-release/bin/solana program deploy programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so --keypair /tmp/wallet.json --url devnet 2>&1

      - name: Verify
        run: /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet || echo "Done"
