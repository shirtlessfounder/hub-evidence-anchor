name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: ESagT1sQne5pwpRXLuh8Yh45EmBWBvNywgpsxrcnqsip

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64

          ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          secret = os.environ.get("WALLET_JSON", "").strip()
          print(f"Secret len={len(secret)}")

          raw = None

          # Try base58 first (88-char Solana key format)
          if len(secret) == 88:
              try:
                  n = 0
                  for c in secret:
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, "big")
                  print("Format: base58 -> 64 bytes")
              except ValueError:
                  raw = None

          # Try raw base64
          if raw is None:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) != 64:
                      raw = None
                  else:
                      print("Format: base64 raw -> 64 bytes")
              except Exception:
                  pass

          # Try JSON array format ["1","2",...]
          if raw is None:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      raw = bytes(int(x) if isinstance(x, int) else x for x in arr)
                      print("Format: JSON array -> 64 bytes")
              except Exception:
                  pass

          if raw is None:
              print("ERROR: cannot decode wallet secret")
              exit(1)

          # Write as Solana JSON keypair format
          with open("/tmp/keypair.json", "w") as f:
              json.dump(list(raw), f)
          print("Keypair saved: /tmp/keypair.json")

          # Extract pubkey for airdrop
          pubkey_bytes = raw[32:]
          npub = int.from_bytes(pubkey_bytes, "big")
          addr = ""
          while npub > 0:
              npub, rem = divmod(npub, 58)
              addr = ALPHABET[rem] + addr
          with open("/tmp/pubkey.txt", "w") as f:
              f.write(addr)
          print(f"Pubkey: {addr}")
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          /tmp/solana-release/bin/solana --version
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL
        run: |
          # Faucet can't credit program accounts. Generate a fresh deploy wallet.
          echo "Generating fresh deploy wallet..."
          /tmp/solana-release/bin/solana-keygen new --no-passphrase -o /tmp/deploy-wallet.json 2>/dev/null
          DEPLOY_PUBKEY=$(/tmp/solana-release/bin/solana-keygen pubkey /tmp/deploy-wallet.json)
          echo "Deploy wallet: $DEPLOY_PUBKEY"
          echo "$DEPLOY_PUBKEY" > /tmp/deploy-pubkey.txt

          # Try multiple RPC endpoints to avoid rate limiting
          for endpoint in "https://api.devnet.solana.com" "https://devnet.helius-rpc.com/?api-key="; do
            echo "Airdrop attempt on $endpoint..."
            if /tmp/solana-release/bin/solana airdrop 10 "$DEPLOY_PUBKEY" --url "$endpoint" 2>&1 | grep -q "Success"; then
              echo "Airdrop succeeded on $endpoint"
              break
            fi
            echo "Rate-limited on $endpoint, trying next..."
            sleep 1
          done
          echo "Final balance:"
          /tmp/solana-release/bin/solana balance "$DEPLOY_PUBKEY" --url https://api.devnet.solana.com

      - name: Deploy
        run: |
          DEPLOY_PUBKEY=$(cat /tmp/deploy-pubkey.txt)
          echo "Deploying to program ID: $PROGRAM_ID"
          echo "Signing with wallet: $DEPLOY_PUBKEY"
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/deploy-wallet.json \
            --program-id $PROGRAM_ID \
            --url devnet

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
