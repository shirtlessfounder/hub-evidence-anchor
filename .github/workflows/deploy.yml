name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$ANCHOR_WALLET_JSON" | base64 -d > /tmp/wallet.json
          python3 -c "
import json
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58encode(b):
    n = int.from_bytes(b, 'big')
    r = []
    while n > 0:
        n, rem = divmod(n, 58)
        r.append(ALPHABET[rem])
    return ''.join(reversed(r))
d = json.load(open('/tmp/wallet.json'))
kp = bytes(d)
pub = b58encode(kp[32:])
print('WALLET:', pub)
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL to deploy wallet
        run: |
          /tmp/solana-release/bin/solana airdrop 2 /tmp/wallet.json --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy pre-built .so
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --url devnet \
            --commitment finalized

      - name: Verify deployment
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
