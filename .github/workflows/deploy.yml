name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_CLI_VERSION: '1.18.26'
  ANCHOR_VERSION: '0.32.1'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '6dap1barBURnSHW3qYMg7JK6iZGFUWWWMLSx4Qynbqek'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write deploy wallet
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json

      - name: Install Solana CLI
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --max-time 600 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar xf solana.tar.bz2
          rm solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install BPF toolchain
        run: |
          solana-install add bpf-tools || echo "bpf-tools may already be installed"
          echo "SBF_OUT_DIR=$PWD/solana-release/sdk" >> $GITHUB_ENV

      - name: Install Anchor CLI (via cargo — pre-built binary requires newer GLIBC than CI has)
        run: cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CARGO_BUILD_JOBS: '4'
          LIBSODIUM_DEV_MAX_VERSION: '99.99.99'

      - name: Build
        run: |
          export SBF_OUT_DIR="$PWD/solana-release/sdk"
          anchor build
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PWD/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Airdrop SOL (devnet only)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PWD/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json

      - name: Deploy
        run: anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PWD/solana-release/bin:$PATH
          ANCHOR_WALLET: /tmp/deploy-wallet.json

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: $HOME/.cargo/bin:/usr/local/bin:$HOME/.local/share/solana/install/active_release/bin:$PWD/solana-release/bin:$PATH
