name: Deploy to Solana Devnet

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
def b58decode(s):
    n = 0
    for c in s:
        n = n * 58 + ALPHABET.index(c)
    result = []
    while n > 0:
        result.append(n & 255)
        n >>= 8
    return bytes(result)
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = b58decode(encoded)
open('/tmp/deploy-keypair.json', 'wb').write(keypair_bytes)
print(f'Keypair saved: {len(keypair_bytes)} bytes')
"

      - name: Install Solana CLI + BPF toolchain
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> \$GITHUB_PATH
          echo "Solana CLI installed:"
          /tmp/solana-release/bin/solana --version
          echo "Installing BPF toolchain..."
          /tmp/solana-release/bin/solana-install add bpf-tools || echo "bpf-tools install completed"

      - name: Install Anchor CLI
        run: |
          mkdir -p ~/.cargo/bin
          curl -L --fail --retry 3 "https://github.com/solana-foundation/anchor/releases/download/v1.0.0/anchor-1.0.0-x86_64-unknown-linux-gnu" -o ~/.cargo/bin/anchor
          chmod +x ~/.cargo/bin/anchor
          anchor --version

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:/tmp/solana-release/bin:\$PATH"
          echo "Anchor:" && anchor --version
          echo "Solana:" && solana --version
          echo "Building..." && anchor build

      - name: Deploy
        run: |
          export PATH="/tmp/solana-release/bin:\$PATH"
          echo "Requesting airdrop..."
          solana airdrop 2 --url devnet --keypair /tmp/deploy-keypair.json || echo "Airdrop failed (may already be funded)"
          echo "Deploying program..."
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: |
          export PATH="/tmp/solana-release/bin:\$PATH"
          echo "Waiting for confirmation..."
          sleep 5
          solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet || echo "275Q not found — trying alternative IDs"
