name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xjf - -C /tmp
          echo "PATH=/tmp/solana-release/bin:$PATH" >> $GITHUB_ENV

      - name: Install Anchor CLI
        run: |
          set -e
          npm install -g @coral-xyz/anchor-cli@0.30.0
          echo "$(npm root -g)" >> $GITHUB_PATH

      - name: Decode program wallet
        env:
          PROGRAM_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json
          secret = os.environ.get("PROGRAM_WALLET_JSON", "").strip()
          if len(secret) == 88:
              raw = base64.b64decode(secret)
          elif secret.startswith('['):
              raw = json.loads(secret)
          else:
              raw = base64.b64decode(secret)
          with open("/tmp/program-wallet.json", "w") as f:
              json.dump(list(raw), f)
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          arr = bytes(raw)
          pub = arr[32:]
          n = int.from_bytes(pub, 'big')
          addr = ''
          while n > 0: n, rem = divmod(n, 58); addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          PYEOF

      - name: Airdrop SOL
        run: |
          set -e
          export PATH="/tmp/solana-release/bin:$PATH"
          solana airdrop 5 /tmp/program-wallet.json --url devnet || true
          solana balance /tmp/program-wallet.json --url devnet

      - name: Deploy program
        run: |
          set -e
          export PATH="/tmp/solana-release/bin:$PATH"
          solana program close --buffers --keypair /tmp/program-wallet.json --url devnet 2>/dev/null || true
          solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/program-wallet.json \
            --program-id $PROGRAM_ID \
            --url devnet

      - name: Verify
        run: |
          export PATH="/tmp/solana-release/bin:$PATH"
          solana program show $PROGRAM_ID --url devnet
