name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Cluster (devnet/mainnet-beta)'
        required: true
        default: 'devnet'

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '1.0.0'
  PROGRAM_NAME: 'hub-evidence-anchor'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/coral-xyz/anchor:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy program keypair to build directory
        run: |
          mkdir -p target/deploy
          cp keys/hub-evidence-anchor-keypair.json target/deploy/hub_evidence_anchor-keypair.json
          echo "Program keypair copied to target/deploy/"
        env:
          PATH: /tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin

      - name: Cache Anchor binary
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/anchor
          key: anchor-${ANCHOR_VERSION}-linux

      - name: Install Solana CLI + Agave SDK
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Install Anchor CLI (pre-built binary)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl --http1.1 -sSfL "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" -o ~/.local/bin/anchor
          chmod +x ~/.local/bin/anchor
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          solana --version
          cargo --version
          anchor --version
        env:
          PATH: ~/.local/bin:$HOME/.cargo/bin:/tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin

      - name: Build Anchor program
        run: |
          anchor build 2>&1
        env:
          PATH: ~/.local/bin:$HOME/.cargo/bin:/tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin
        timeout-minutes: 15

      - name: Airdrop SOL (devnet)
        if: inputs.cluster == 'devnet' || github.event.inputs.cluster == 'devnet'
        run: solana airdrop 2 --url devnet
        env:
          PATH: /tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin

      - name: Deploy to Solana
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/deploy-wallet.json
          anchor deploy --provider.cluster ${{ inputs.cluster || 'devnet' }}
        env:
          PATH: ~/.local/bin:$HOME/.cargo/bin:/tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin
          ANCHOR_WALLET: /tmp/deploy-wallet.json
        timeout-minutes: 10

      - name: Verify deployment
        run: |
          solana program show $PROGRAM_ID --url ${{ inputs.cluster || 'devnet' }}
          echo "---"
          echo "Program ID: $PROGRAM_ID"
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=${{ inputs.cluster || 'devnet' }}"
        env:
          PATH: /tmp/solana-release/bin:/usr/bin:/bin:/usr/local/bin
