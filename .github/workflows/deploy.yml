name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save and decode deploy keypair
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          # Try all possible input formats and save as raw 64-byte keypair
          python3 << 'PYEOF'
          import json, base64, os, sys

          secret = os.environ.get('WALLET_JSON', '').strip()
          print(f'Secret length: {len(secret)}')

          decoded = False

          # Try format 1: base64 of JSON array "[1,2,...]"
          try:
              decoded_arr = json.loads(base64.b64decode(secret))
              if isinstance(decoded_arr, list) and len(decoded_arr) == 64:
                  open('/tmp/keypair.bin', 'wb').write(bytes(decoded_arr))
                  print('Format: base64(JSON array) -> 64-byte keypair')
                  decoded = True
          except: pass

          # Try format 2: plain JSON array "[1,2,...]"
          if not decoded:
              try:
                  arr = json.loads(secret)
                  if isinstance(arr, list) and len(arr) == 64:
                      open('/tmp/keypair.bin', 'wb').write(bytes(arr))
                      print('Format: plain JSON array -> 64-byte keypair')
                      decoded = True
              except: pass

          # Try format 3: base58-encoded raw 64 bytes (88 chars = base58 of 64-byte keypair)
          if not decoded:
              try:
                  ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
                  n = 0
                  for c in secret:
                      if c not in ALPHABET: raise ValueError('not base58')
                      n = n * 58 + ALPHABET.index(c)
                  raw = n.to_bytes(64, 'big')
                  open('/tmp/keypair.bin', 'wb').write(raw)
                  print('Format: base58(raw 64 bytes)')
                  decoded = True
              except: pass

          # Try format 4: base64 of raw 64 bytes
          if not decoded:
              try:
                  raw = base64.b64decode(secret)
                  if len(raw) == 64:
                      open('/tmp/keypair.bin', 'wb').write(raw)
                      print('Format: base64(raw 64 bytes)')
                      decoded = True
              except: pass

          if not decoded:
              print('ERROR: Could not decode wallet')
              sys.exit(1)
          PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL
        run: |
          /tmp/solana-release/bin/solana airdrop 2 --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy pre-built .so
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/hub_evidence_anchor.so \
            --keypair /tmp/keypair.bin \
            --url devnet \
            --commitment finalized

      - name: Verify deployment
        run: |
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
