name: Deploy to Solana Devnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SOLANA_VERSION: '3.1.12'
  ANCHOR_VERSION: '1.0.0'
  PROGRAM_ID: '275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
      - name: Save deploy keypair
        run: |
          echo "${{ secrets.ANCHOR_WALLET_JSON }}" > /tmp/encoded_b58.txt
          python3 -c "
import base64
encoded = open('/tmp/encoded_b58.txt').read().strip()
keypair_bytes = base64.b58decode(encoded)
open('target/deploy/hub_evidence_anchor-keypair.json', 'wb').write(keypair_bytes)
"
      - name: Install build tools + Rust + Anchor
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo install anchor-cli@${ANCHOR_VERSION}
      - name: Build
        run: anchor build
        env:
          PATH: $HOME/.cargo/bin:/tmp/solana-release/bin:$PATH
        timeout-minutes: 20
      - name: Deploy
        run: |
          solana airdrop 2 --url devnet || true
          solana program deploy target/deploy/hub_evidence_anchor.so --keypair target/deploy/hub_evidence_anchor-keypair.json --url devnet
        env:
          PATH: /tmp/solana-release/bin:$PATH
        timeout-minutes: 15
      - name: Verify
        run: solana program show $PROGRAM_ID --url devnet
