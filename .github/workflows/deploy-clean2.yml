name: Deploy Clean v2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save deploy keypair
        env:
          ANCHOR_WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 -c "
import os, base64
secret = os.environ.get('ANCHOR_WALLET_JSON', '')
print(f'Secret length: {len(secret)} chars')
if len(secret) < 10:
    print('ERROR: Secret empty!')
    exit(1)
decoded = base64.b64decode(secret.strip())
print(f'Decoded: {len(decoded)} bytes')
with open('/tmp/deploy-keypair.json', 'wb') as f:
    f.write(decoded)
print('Keypair written')
"

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Check wallet balance
        run: |
          /tmp/solana-release/bin/solana balance --keypair /tmp/deploy-keypair.json --url devnet

      - name: Airdrop SOL if needed
        run: |
          BALANCE=$(/tmp/solana-release/bin/solana balance --keypair /tmp/deploy-keypair.json --url devnet 2>/dev/null | awk '{print $1}')
          echo "Current balance: $BALANCE SOL"
          if [ "$BALANCE" = "0" ] || [ -z "$BALANCE" ]; then
            echo "Airdropping 2 SOL..."
            /tmp/solana-release/bin/solana airdrop 2 --keypair /tmp/deploy-keypair.json --url devnet || echo "Airdrop may have failed"
          fi

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so --keypair /tmp/deploy-keypair.json --url devnet

      - name: Verify
        run: /tmp/solana-release/bin/solana program show 275QQuz5D6d5U7rhAVW1gYGZBmmyzq6srFdV3rT6rMdA --url devnet
