on:
  push:
  workflow_dispatch:

name: Build and Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI (v3.1.13 with platform-tools v1.52 / Rust 1.89)
        run: |
          set -e
          # Use GitHub URL to avoid SSL errors with release.solana.com
          curl -L --proto '=https' --tlsv1.2 -f "https://github.com/anza-xyz/agave/releases/download/v3.1.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          tar jxf /tmp/solana.tar.bz2
          rm -f /tmp/solana.tar.bz2
          rm -rf /tmp/solana-release
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version
          echo "=== cargo-build-sbf version ==="
          /tmp/solana-release/bin/cargo-build-sbf --version

      - name: Install Rust toolchains
        run: |
          mkdir -p /opt/cargo /opt/rustup
          # Install Rust 1.85 (needed for cargo build-sbf to run cargo as a subprocess)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "=== Rust toolchains ==="
          rustup toolchain list

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format clang
          clang --version

      - name: Decode wallet
        run: |
          echo $ANCHOR_WALLET_JSON | base64 -d > /tmp/wallet.json
          solana-keygen verify /tmp/wallet.json || echo "Wallet decode done"

      - name: Install platform-tools Rust 1.89 (supports edition 2024)
        run: |
          # platform-tools v1.52 (in v3.1.13) includes Rust 1.89 which supports edition 2024
          # Use --install-only to download without building
          # Unset RUSTC/CARGO so platform-tools installer can manage them freely
          env -u RUSTC -u CARGO \
            /tmp/solana-release/bin/cargo-build-sbf --install-only --force-tools-install 2>&1 | tail -5

          # Find the installed platform-tools rust
          PLATFORM_TOOLS_RUST=$(find "$HOME/.cache/solana" -maxdepth 3 -name "rustc" -path "*/platform-tools/*/bin/rustc" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || echo "")
          echo "Platform-tools rust: $PLATFORM_TOOLS_RUST"
          if [ -z "$PLATFORM_TOOLS_RUST" ] || [ ! -f "$PLATFORM_TOOLS_RUST/bin/rustc" ]; then
            echo "ERROR: Platform-tools rust not found"
            ls -la "$HOME/.cache/solana/" 2>/dev/null || echo "No cache"
            exit 1
          fi
          echo "Rustc: $($PLATFORM_TOOLS_RUST/bin/rustc --version)"

          # Link platform-tools rust as rustup toolchain 'solana'
          # cargo +solana is used internally by cargo-build-sbf for the actual program compilation
          rustup toolchain link solana "$PLATFORM_TOOLS_RUST" 2>&1 || echo "link may exist"
          echo "=== Toolchains ==="
          rustup toolchain list
          echo "=== Test cargo +solana ==="
          cargo +solana --version 2>&1 || echo "cargo +solana test done"

      - name: Generate Cargo.lock (with edition 2024 deps)
        run: |
          # Generate lockfile with Rust 1.85 (parses edition 2024)
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          echo "=== cargo version ==="
          cargo --version
          echo "=== Generating Cargo.lock ==="
          cargo generate-lockfile 2>&1 | tail -5
          ls -la Cargo.lock 2>/dev/null && echo "Cargo.lock created" || echo "No Cargo.lock"

      - name: Build program
        run: |
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo "=== Building with cargo build-sbf ==="
          # cargo-build-sbf internally calls cargo +solana which uses platform-tools Rust 1.89
          /tmp/solana-release/bin/cargo-build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1

      - name: Check artifact
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          if [ -n "$SO" ] && [ -f "$SO" ]; then
            echo "Artifact found!"
            ls -lh "$SO"
          else
            echo "ERROR: No .so found"
            find . -name "hub_evidence_anchor.so" 2>/dev/null | head -5
            exit 1
          fi

      - name: Deploy to mainnet-beta
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "Deploying: $SO"
          ls -lh "$SO"
          solana program deploy "$SO" \
            --keypair /tmp/wallet.json \
            --url mainnet-beta \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --skip-upgrade-authority-validation 2>&1

      - name: Verify deployment
        run: |
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta 2>&1 || echo "Check done"
