name: Build and Deploy to Mainnet-Beta

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build (use existing .so)'
        required: false
        default: 'false'
        type: boolean

env:
  SOLANA_CLI_VERSION: "v1.18.6"
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  RPC_URL: ${{ vars.HELIUS_MAINNET_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
  PATH: /tmp/solana-release/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "PATH=/tmp/solana-release/bin:\$PATH" >> $GITHUB_ENV
          echo "Installed: $(/tmp/solana-release/bin/solana --version)"

      - name: Install Rust + Solana toolchain
        run: |
          if ! command -v cargo &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          PLATFORM_TOOLS_RUST=$(find "$HOME/.cache/solana" -name "rustc" -path "*/platform-tools/*/rust/bin/rustc" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || true)
          echo "Found platform-tools rust: $PLATFORM_TOOLS_RUST"
          if [ -n "$PLATFORM_TOOLS_RUST" ] && [ -d "$PLATFORM_TOOLS_RUST" ]; then
            rustup toolchain link solana "$PLATFORM_TOOLS_RUST" 2>&1 || true
          fi
          rustup toolchain list || true
          cargo +solana --version 2>/dev/null || echo "solana toolchain link may have failed"

      - name: Decode wallet (base58 -> JSON keypair)
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              n = 0
              for c in secret:
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
          elif secret.startswith('['):
              raw = bytes(json.loads(secret))
          else:
              raw = base64.b64decode(secret)
          with open("/tmp/wallet.json", "w") as f:
              json.dump([int(b) for b in raw], f)
          pub = raw[32:]
          n = int.from_bytes(pub, 'big')
          addr = ''
          while n > 0: n, rem = divmod(n, 58); addr = ALPHABET[rem] + addr
          print(f"Wallet pubkey: {addr}")
          with open("/tmp/program-pubkey.txt", "w") as f:
              f.write(addr + "\n")
          PYEOF

      - name: Check existing program on mainnet
        run: |
          echo "=== Checking spJAH8 on mainnet ==="
          /tmp/solana-release/bin/solana account $PROGRAM_ID --url $RPC_URL || echo "Program not yet on mainnet — will deploy fresh"
          echo "=== Current slot ==="
          /tmp/solana-release/bin/solana slot --url $RPC_URL

      - name: Build program
        if: inputs.skip_build != 'true'
        run: |
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo ""
          echo "=== Cleaning lockfiles ==="
          find . -name "Cargo.lock" -delete 2>/dev/null || true
          echo ""
          echo "=== Building with cargo-build-sbf ==="
          cargo-build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1
          echo ""
          echo "=== Verifying artifact ==="
          if [ -f programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so ]; then
            echo "BUILD SUCCESS"
            ls -lh programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
          else
            echo "BUILD FAILED: No .so found"
            find programs/hub-evidence-anchor/target -name "*.so" 2>/dev/null || echo "No .so files"
            exit 1
          fi

      - name: Check SOL balance for deploy
        run: |
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          BALANCE=$(/tmp/solana-release/bin/solana balance "$UPGRADE_AUTH" --url $RPC_URL | awk '{print $1}')
          echo "Balance: $BALANCE SOL"
          # Deploy needs ~0.1 SOL for the program size (adjust if needed)
          echo "balance=$BALANCE" >> $GITHUB_ENV

      - name: Close stale buffers (cleanup)
        run: |
          echo "=== Closing stale buffers ==="
          /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url $RPC_URL 2>&1 || echo "No buffers to clean"

      - name: Deploy to mainnet-beta
        run: |
          SO_FILE="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "ERROR: No .so found at $SO_FILE — set skip_build=false or push a built .so"
            exit 1
          fi
          echo "=== Artifact ==="
          ls -lh "$SO_FILE"
          echo ""
          echo "=== Generating ephemeral buffer ==="
          /tmp/solana-release/bin/solana-keygen new --no-passphrase -o /tmp/buffer-keypair.json 2>/dev/null || true
          echo ""
          echo "=== Deploying spJAH8 to mainnet-beta ==="
          set -x
          /tmp/solana-release/bin/solana program deploy \
            "$SO_FILE" \
            --keypair /tmp/wallet.json \
            --buffer /tmp/buffer-keypair.json \
            --program-id $PROGRAM_ID \
            --url $RPC_URL 2>&1
          set +x

      - name: Verify deployment
        run: |
          echo "=== Final program account on mainnet ==="
          /tmp/solana-release/bin/solana account $PROGRAM_ID --url $RPC_URL
          echo ""
          echo "=== Program info ==="
          /tmp/solana-release/bin/solana program show $PROGRAM_ID --url $RPC_URL
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo ""
          echo "=== Final balance ==="
          /tmp/solana-release/bin/solana balance "$UPGRADE_AUTH" --url $RPC_URL
