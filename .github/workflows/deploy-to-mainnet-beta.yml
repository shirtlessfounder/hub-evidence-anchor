on:
  push:
  workflow_dispatch:

name: Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
      - name: Setup Rust 1.85
        run: |
          mkdir -p /opt/cargo /opt/rustup
          curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs |             CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME"             sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format clang
      - name: Decode wallet
        run: |
          python3 -c "
import os, base64
ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
secret = os.environ.get('ANCHOR_WALLET_JSON', '').strip()
if len(secret) == 88:
    n = 0
    for c in secret:
        n = n * 58 + ALPHABET.index(c)
    raw = n.to_bytes(64, 'big')
    with open('/tmp/wallet.json', 'wb') as f:
        f.write(raw)
    print('Wallet decoded (base58, 64 bytes)')
else:
    with open('/tmp/wallet.json', 'wb') as f:
        f.write(base64.b64decode(secret))
    print('Wallet decoded (base64)')
" 
      - name: Check balance
        run: |
          /tmp/solana-release/bin/solana balance --keypair /tmp/wallet.json --url mainnet-beta || echo "Balance check"
      - name: Close buffers
        run: |
          /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url mainnet-beta || true
      - name: Generate Cargo.lock
        run: |
          cargo +1.85 generate-lockfile 2>&1 || true
      - name: Build
        run: |
          /tmp/solana-release/bin/cargo-build-sbf 2>&1
      - name: Copy artifact
        run: |
          mkdir -p programs/hub-evidence-anchor/target/deploy
          cp target/sbpf-solana-solana/release/hub_evidence_anchor.so programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
          ls -lh programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy             programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so             --keypair /tmp/wallet.json --url mainnet-beta             2>&1
      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta || echo "Done"

