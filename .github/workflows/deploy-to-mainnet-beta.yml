on:
  push:
  workflow_dispatch:

name: Build and Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          solana --version

      - name: Setup Rust toolchain
        run: |
          mkdir -p /opt/cargo /opt/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format clang
          clang --version

      - name: Decode wallet
        run: |
          echo $ANCHOR_WALLET_JSON | base64 -d > /tmp/wallet.json
          solana-keygen verify /tmp/wallet.json || echo "Wallet decode done"

      - name: Generate Cargo.lock with Rust 1.85
        run: |
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          echo "=== cargo version ==="
          cargo --version
          echo "=== Generating Cargo.lock ==="
          cargo generate-lockfile 2>&1 || true
          ls -la Cargo.lock 2>/dev/null || echo "No Cargo.lock"

      - name: Build program
        run: |
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          
          # Create cargo wrapper: intercepts "cargo metadata" → uses cargo +1.89
          # All other commands → use the solana toolchain cargo
          mkdir -p /tmp/solana-release/bin
          mv /tmp/solana-release/bin/cargo /tmp/solana-release/bin/cargo-real 2>/dev/null || true
          cat > /tmp/solana-release/bin/cargo << 'WRAPPER'
          #!/bin/bash
          if [[ "$*" == *"metadata"* ]]; then
            # cargo-metadata needs a modern cargo for edition 2024 deps
            exec "$CARGO_HOME/bin/cargo" +1.89 "$@"
          else
            # Build commands go to the solana toolchain
            exec /tmp/solana-release/bin/cargo-real "$@"
          fi
          WRAPPER
          chmod +x /tmp/solana-release/bin/cargo
          
          echo "=== cargo-build-sbf version ==="
          /tmp/solana-release/bin/cargo-build-sbf --version
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo "=== Building with cargo build-sbf (cargo wrapper) ==="
          /tmp/solana-release/bin/cargo-build-sbf 2>&1

      - name: Deploy to mainnet-beta
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          if [ -z "$SO" ]; then
            SO=$(find . -name "hub_evidence_anchor.so" 2>/dev/null | grep -v node_modules | head -1)
          fi
          echo "Artifact: $SO"
          if [ -n "$SO" ] && [ -f "$SO" ]; then
            solana program deploy "$SO" \
              --keypair /tmp/wallet.json \
              --url mainnet-beta \
              --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
              --skip-upgrade-authority-validation 2>&1
          else
            echo "ERROR: No .so artifact found!"
            find . -name "*.so" 2>/dev/null | head -10
            exit 1
          fi

      - name: Verify deployment
        run: |
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta 2>&1 || echo "Check done"
