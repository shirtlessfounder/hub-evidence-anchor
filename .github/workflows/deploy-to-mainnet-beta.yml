on:
  push:
  workflow_dispatch:

name: Build and Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          set -e
          # Use GitHub URL to avoid SSL errors with release.solana.com
          curl -L --proto '=https' --tlsv1.2 -f "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          tar jxf /tmp/solana.tar.bz2
          rm -f /tmp/solana.tar.bz2
          rm -rf /tmp/solana-release
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version
          # Install the Solana rustup toolchain (needed for cargo +solana from cargo-build-sbf)
          # Uses the existing RUSTUP_HOME=/opt/rustup from env
          curl -L --proto '=https' --tlsv1.2 -f "https://github.com/anza-xyz/agave/releases/download/v1.18.6/agave-install-init-x86_64-unknown-linux-gnu" -o /tmp/agave-install-init
          chmod +x /tmp/agave-install-init
          RUSTUP_HOME=/opt/rustup /tmp/agave-install-init --version v1.18.6 2>&1 | tail -5
          rustup toolchain list

      - name: Setup Rust toolchains (1.85 for build, 1.89 for metadata)
        run: |
          mkdir -p /opt/cargo /opt/rustup
          # Install Rust 1.85 (for cargo build-sbf) at custom CARGO_HOME/RUSTUP_HOME
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          # Install Rust 1.89 (for cargo metadata — parses edition 2024 crates)
          RUSTUP_HOME=/opt/rustup rustup toolchain install 1.89.0 2>&1 | tail -3 || echo "1.89 already installed"
          echo "=== Installed toolchains ==="
          rustup toolchain list

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format clang
          clang --version

      - name: Decode wallet
        run: |
          echo $ANCHOR_WALLET_JSON | base64 -d > /tmp/wallet.json
          solana-keygen verify /tmp/wallet.json || echo "Wallet decode done"

      - name: Create cargo wrapper (metadata → Rust 1.89, build → Rust 1.85)
        run: |
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"

          # rustup toolchain list output:
          #   1.85.0-x86_64-unknown-linux-gnu (default)
          #   1.89.0-x86_64-unknown-linux-gnu
          # Parse the full name (strip " (default)" suffix) and construct path
          RUST_185_FULL=$(rustup toolchain list | grep "^1\.85\." | sed 's/ (default)//')
          RUST_189_FULL=$(rustup toolchain list | grep "^1\.89\." | sed 's/ (default)//')
          RUST_185_PATH="/opt/rustup/toolchains/${RUST_185_FULL}/bin"
          RUST_189_PATH="/opt/rustup/toolchains/${RUST_189_FULL}/bin"
          echo "Rust 1.85: $RUST_185_PATH"
          echo "Rust 1.89: $RUST_189_PATH"
          echo "Cargo 1.85 exists: $(test -f "$RUST_185_PATH/cargo" && echo YES || echo NO)"
          echo "Cargo 1.89 exists: $(test -f "$RUST_189_PATH/cargo" && echo YES || echo NO)"

          [ -n "$RUST_185_PATH" ] || { echo "ERROR: Rust 1.85 not found"; exit 1; }
          [ -n "$RUST_189_PATH" ] || { echo "ERROR: Rust 1.89 not found"; exit 1; }
          [ -f "$RUST_185_PATH/cargo" ] || { echo "ERROR: Rust 1.85 cargo missing at $RUST_185_PATH/cargo"; ls -la "/opt/rustup/toolchains/${RUST_185_FULL}/" 2>/dev/null || echo "toolchain dir not found"; exit 1; }
          [ -f "$RUST_189_PATH/cargo" ] || { echo "ERROR: Rust 1.89 cargo missing at $RUST_189_PATH/cargo"; exit 1; }

          "$RUST_189_PATH/cargo" --version
          "$RUST_185_PATH/cargo" --version

          # Create wrapper at /tmp/solana-release/bin/cargo:
          # metadata → Rust 1.89 (parses edition 2024 Cargo.toml)
          # all other → Rust 1.85 (cargo build-sbf compatible)
          # NOTE: must use EXPLICIT binary paths, NOT $CARGO_HOME/bin/cargo
          # because $CARGO_HOME/bin/cargo IS the rustup proxy for 1.85
          cat > /tmp/solana-release/bin/cargo << WRAPPER
          #!/bin/bash
          # Add CARGO_HOME/bin so rustup is available at runtime for +solana routing
          export PATH="$CARGO_HOME/bin:$PATH"
          for arg in "\$@"; do
            if echo "\$arg" | grep -q "metadata"; then
              "$RUST_189_PATH/cargo" "\$@"
              exit_code=\$?
              # v4 Cargo.lock was created by cargo +1.89 — delete it
              # cargo build-sbf (Rust 1.85) can't read v4 lock format
              rm -f Cargo.lock
              exit \$exit_code
            fi
          done
          # Handle +solana: forward to rustup run solana (cargo-build-sbf uses this internally)
          # shellcheck doesn't support 'declare' in heredoc heredoc delimiter
          has_solana=$(echo "\$*" | grep -c '+solana' || true)
          if [ "\$has_solana" -gt 0 ]; then
            # Strip +solana from args and forward to rustup run solana
            cleaned=\$(echo "\$*" | sed 's/+solana//g')
            exec rustup run solana cargo \$cleaned
          fi
          exec "$RUST_185_PATH/cargo" "\$@"
          WRAPPER
          chmod +x /tmp/solana-release/bin/cargo

          echo "=== Test: cargo metadata (routes to Rust 1.89) ==="
          /tmp/solana-release/bin/cargo metadata --format-version 1 2>&1 | head -3

      - name: Generate Cargo.lock
        run: |
          export PATH="/tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
          echo "=== cargo version ==="
          cargo --version
          echo "=== Generating Cargo.lock ==="
          cargo generate-lockfile 2>&1 | tail -5
          ls -la Cargo.lock 2>/dev/null && echo "Cargo.lock created" || echo "No Cargo.lock"

      - name: Build program
        run: |
          export PATH="/tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          echo "=== cargo-build-sbf version ==="
          /tmp/solana-release/bin/cargo-build-sbf --version
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo "=== Building with cargo build-sbf ==="
          /tmp/solana-release/bin/cargo-build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1

      - name: Check artifact
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          if [ -n "$SO" ] && [ -f "$SO" ]; then
            echo "Artifact found!"
            ls -lh "$SO"
          else
            echo "ERROR: No .so found"
            find . -name "hub_evidence_anchor.so" 2>/dev/null | head -5
            exit 1
          fi

      - name: Deploy to mainnet-beta
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "Deploying: $SO"
          ls -lh "$SO"
          solana program deploy "$SO" \
            --keypair /tmp/wallet.json \
            --url mainnet-beta \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --skip-upgrade-authority-validation 2>&1

      - name: Verify deployment
        run: |
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta 2>&1 || echo "Check done"
