on:
  push:
  workflow_dispatch:

name: Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"
  SOLANA_CLI_VERSION: "v1.18.6"
  PATH: /tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin:$PATH

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (bzip2 for tar + clang for BPF)
        run: sudo apt-get update && sudo apt-get install -y bzip2 clang

      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Setup Rust toolchain
        run: |
          mkdir -p /opt/cargo /opt/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path

      - name: Decode wallet (Python base58 → JSON array)
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, json, base64
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          secret = os.environ.get('WALLET_JSON', '').strip()
          if len(secret) == 88:
              # Base58 decode
              n = 0
              for c in secret:
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
              key = list(raw)
              print('Wallet decoded (base58)')
          elif secret.startswith('['):
              # Already JSON array
              key = json.loads(secret)
              print('Wallet parsed (JSON array)')
          else:
              # Base64 decode
              raw = base64.b64decode(secret)
              key = list(raw)
              print('Wallet decoded (base64)')
          # Always write as JSON array — Solana CLI v3.x requires this format
          with open('/tmp/wallet.json', 'w') as f:
              json.dump(key, f)
          print('Written wallet as JSON array: /tmp/wallet.json')
          PYEOF

      - name: Check balance and close buffers
        run: |
          /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url mainnet-beta 2>&1 || echo "No buffers to close"
          /tmp/solana-release/bin/solana balance --keypair /tmp/wallet.json --url mainnet-beta 2>&1 || echo "Balance check done"

      - name: Install solana-cargo-build-sbf from crates.io (v4.0.0, built with Rust 1.85)
        run: |
          # Install v4.0.0 from crates.io using Rust 1.85
          # v4.0.0 uses Rust 1.85+ internally → can parse edition2024 crates
          # The Solana CLI bundled cargo-build-sbf (v1.72) can't parse v4 lockfiles
          /opt/cargo/bin/cargo +1.85 install solana-cargo-build-sbf --version 4.0.0 2>&1 || \
            /opt/cargo/bin/cargo +1.85 install solana-cargo-build-sbf 2>&1 || true
          echo "=== Installed cargo-build-sbf ==="
          ~/.cargo/bin/cargo-build-sbf --version 2>&1 || echo "Install may have failed"

      - name: Build program
        run: |
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          # Use the crates.io version (v4.0.0) which has Rust 1.85 internally
          echo "=== cargo-build-sbf version ==="
          ~/.cargo/bin/cargo-build-sbf --version 2>&1 || echo "Using fallback"
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo "=== Building with solana-cargo-build-sbf v4 (Rust 1.85) ==="
          ~/.cargo/bin/cargo-build-sbf 2>&1
          echo "=== Artifact ==="
          SBF_OUT="target/sbpf-solana-solana/release/hub_evidence_anchor.so"
          if [ -f "$SBF_OUT" ]; then
            echo "BUILD SUCCESS: $(ls -lh $SBF_OUT)"
          else
            echo "BUILD FAILED: No artifact at $SBF_OUT"
            find . -name "hub_evidence_anchor.so" 2>/dev/null | head -3
            exit 1
          fi

      - name: Check artifact
        run: |
          SBF_OUT="target/sbpf-solana-solana/release/hub_evidence_anchor.so"
          DEPLOY_DIR="programs/hub-evidence-anchor/target/deploy"
          mkdir -p "$DEPLOY_DIR"
          if [ -f "$SBF_OUT" ]; then
            cp "$SBF_OUT" "$DEPLOY_DIR/hub_evidence_anchor.so"
            echo "Copied to deploy dir: $(ls -lh $DEPLOY_DIR/hub_evidence_anchor.so)"
          else
            echo "ERROR: No .so found at $SBF_OUT"
            exit 1
          fi

      - name: Deploy to mainnet-beta
        run: |
          SO="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          echo "=== Deploying $SO ==="
          ls -lh "$SO"
          /tmp/solana-release/bin/solana program deploy "$SO" \
            --keypair /tmp/wallet.json \
            --url mainnet-beta \
            --skip-upgrade-authority-validation 2>&1

      - name: Verify deployment
        run: |
          echo "=== Verifying program on mainnet ==="
          /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta 2>&1 || echo "Program check done"
