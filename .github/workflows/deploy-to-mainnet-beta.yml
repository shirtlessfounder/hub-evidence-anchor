on:
  push:
  workflow_dispatch:

name: Build and Deploy to Mainnet-Beta

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://release.solana.com/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Setup Rust toolchains (1.85 for build, 1.89 for metadata)
        run: |
          mkdir -p /opt/cargo /opt/rustup
          # Install Rust 1.85 (for cargo build-sbf)
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          # Install Rust 1.89 separately (for cargo metadata parsing edition 2024 crates)
          /opt/cargo/bin/rustup toolchain install 1.89.0 2>&1 | tail -3
          echo "=== Installed toolchains ==="
          /opt/cargo/bin/rustup show
          # Find the 1.89 toolchain path and expose it
          RUST_189_PATH=$(find /opt/rustup/toolchains -maxdepth 2 -name "cargo" -path "*1.89*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
          echo "Rust 1.89 at: $RUST_189_PATH"
          echo "RUST_189_PATH=$RUST_189_PATH" >> $GITHUB_ENV

      - name: Install clang
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format clang
          clang --version

      - name: Decode wallet
        run: |
          echo $ANCHOR_WALLET_JSON | base64 -d > /tmp/wallet.json
          solana-keygen verify /tmp/wallet.json || echo "Wallet decode done"

      - name: Create cargo wrapper (metadata → Rust 1.89, build → Rust 1.85)
        run: |
          export PATH="$CARGO_HOME/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"

          # Rust 1.89 path from previous step
          RUST_189_PATH="${RUST_189_PATH:-$(find /opt/rustup/toolchains -maxdepth 2 -name "cargo" -path "*1.89*" 2>/dev/null | head -1 | xargs dirname)}"
          echo "Using Rust 1.89 at: $RUST_189_PATH"
          "$RUST_189_PATH/cargo" --version || { echo "ERROR: Rust 1.89 not found"; exit 1; }

          # Backup the real cargo (Rust 1.85) as cargo-real
          cp "$CARGO_HOME/bin/cargo" /tmp/solana-release/bin/cargo-real

          # Create wrapper: metadata → Rust 1.89, everything else → Rust 1.85
          # Key fix: after metadata runs (creates v4 Cargo.lock), auto-delete it
          # so cargo build/sbf doesn't try to read an incompatible lock file
          cat > /tmp/solana-release/bin/cargo << WRAPPER
          #!/bin/bash
          for arg in "$@"; do
            if echo "$arg" | grep -q "metadata"; then
              "$RUST_189_PATH/cargo" "$@"
              exit_code=$?
              # v4 Cargo.lock was created by cargo +1.89 — delete it
              # cargo build-sbf uses the solana toolchain which can't read v4
              rm -f Cargo.lock
              exit $exit_code
            fi
          done
          exec /tmp/solana-release/bin/cargo-real "$@"
          WRAPPER
          chmod +x /tmp/solana-release/bin/cargo

          echo "=== Versions ==="
          /tmp/solana-release/bin/cargo --version
          "$RUST_189_PATH/cargo" --version
          echo ""
          echo "=== Test: cargo metadata (should route to Rust 1.89) ==="
          /tmp/solana-release/bin/cargo metadata --format-version 1 2>&1 | head -3

      # NOTE: v4 Cargo.lock deletion is handled automatically by the cargo wrapper
      # (wrapper deletes Cargo.lock after every cargo +1.89 metadata call)
      - name: Generate Cargo.lock
        run: |
          export PATH="/tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
          echo "=== cargo version ==="
          cargo --version
          echo "=== Generating Cargo.lock ==="
          cargo generate-lockfile 2>&1 | tail -5
          ls -la Cargo.lock 2>/dev/null && echo "Cargo.lock created" || echo "No Cargo.lock"

      - name: Build program
        run: |
          export PATH="/tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          echo "=== cargo-build-sbf version ==="
          /tmp/solana-release/bin/cargo-build-sbf --version
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs || true
          echo "=== Building with cargo build-sbf ==="
          /tmp/solana-release/bin/cargo-build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1

      - name: Check artifact
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          if [ -n "$SO" ] && [ -f "$SO" ]; then
            echo "Artifact found!"
            ls -lh "$SO"
          else
            echo "ERROR: No .so found"
            find . -name "hub_evidence_anchor.so" 2>/dev/null | head -5
            exit 1
          fi

      - name: Deploy to mainnet-beta
        run: |
          SO=$(find programs/hub-evidence-anchor/target -name "hub_evidence_anchor.so" 2>/dev/null | head -1)
          echo "Deploying: $SO"
          ls -lh "$SO"
          solana program deploy "$SO" \
            --keypair /tmp/wallet.json \
            --url mainnet-beta \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --skip-upgrade-authority-validation 2>&1

      - name: Verify deployment
        run: |
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url mainnet-beta 2>&1 || echo "Check done"
