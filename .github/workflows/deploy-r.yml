name: deploy-r

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROGRAM_ID: 8gdV37drn1T33qnomPKxUbkyhqAZ3CEzuF3iR88hET1k

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << PYEOF
import json, base64, os

ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
secret = os.environ.get("WALLET_JSON", "").strip()
print("Secret len:", len(secret))

raw = None

# Try base58 decode first (88-char secret)
try:
    n = 0
    for c in secret:
        if c not in ALPHABET:
            raise ValueError("not base58")
        n = n * 58 + ALPHABET.index(c)
    raw = n.to_bytes(64, "big")
    print("Format: base58 -> 64 bytes")
except Exception as e:
    print("base58 failed:", e)

# Try base64 as fallback
if raw is None:
    try:
        raw = base64.b64decode(secret)
        if len(raw) == 64:
            print("Format: base64 -> 64 bytes")
        else:
            raw = None
    except: pass

# Try JSON array as fallback
if raw is None:
    try:
        arr = json.loads(secret)
        if isinstance(arr, list) and len(arr) == 64:
            raw = bytes(arr)
            print("Format: JSON array -> 64 bytes")
    except: pass

if raw is None:
    print("ERROR: cannot decode wallet")
    exit(1)

# Write solana-keygen JSON format (first 32 bytes = private key)
privkey = raw[:32]
n2 = int.from_bytes(privkey, "big")
priv_b58 = ""
while n2 > 0:
    n2, rem = divmod(n2, 58)
    priv_b58 = ALPHABET[rem] + priv_b58
pubkey = raw[32:]
np = int.from_bytes(pubkey, "big")
pub_b58 = ""
while np > 0:
    np, rem = divmod(np, 58)
    pub_b58 = ALPHABET[rem] + pub_b58
keypair_json = json.dumps({"privkey": priv_b58, "pubkey": pub_b58})
with open("/tmp/keypair.json", "w") as f:
    f.write(keypair_json)
print("Written JSON keypair, pubkey:", pub_b58)
with open("/tmp/pubkey.txt", "w") as f:
    f.write(pub_b58)
PYEOF

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/v1.18.6/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          /tmp/solana-release/bin/solana --version

      - name: Airdrop SOL
        run: |
          PUBKEY=$(cat /tmp/pubkey.txt)
          echo "Airdropping to: $PUBKEY"
          /tmp/solana-release/bin/solana airdrop 10 "$PUBKEY" --url devnet || echo "Airdrop may have rate-limited"

      - name: Deploy
        run: |
          /tmp/solana-release/bin/solana program deploy programs/hub-evidence-anchor/hub_evidence_anchor.so --keypair /tmp/keypair.json --url devnet --commitment finalized

      - name: Verify
        run: /tmp/solana-release/bin/solana program show $PROGRAM_ID --url devnet
