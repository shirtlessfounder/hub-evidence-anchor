name: Build and Deploy (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOLANA_CLI_VERSION: "v1.18.6"
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  PATH: /tmp/solana-release/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          echo "Installed: $(/tmp/solana-release/bin/solana --version)"

      - name: Install Rust + Solana toolchain
        run: |
          export CARGO_HOME="/opt/cargo"
          export RUSTUP_HOME="/opt/rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          rm -rf "$CARGO_HOME" "$RUSTUP_HOME"
          mkdir -p "$CARGO_HOME/bin" "$RUSTUP_HOME"
          # Remove settings.toml BEFORE rustup runs — it overrides --default-toolchain
          rm -f /opt/rustup/settings.toml
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.89.0 
          echo "Installed:"
          "$CARGO_HOME/bin/rustup" toolchain list
          # cargo-build-sbf uses 'cargo +solana' internally — link to platform-tools rust
          PLATFORM_TOOLS_RUST=$(find "$HOME/.cache/solana" -name "rustc" -path "*/platform-tools/*/rust/bin/rustc" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || true)
          echo "Found platform-tools rust: $PLATFORM_TOOLS_RUST"
          if [ -n "$PLATFORM_TOOLS_RUST" ] && [ -d "$PLATFORM_TOOLS_RUST" ]; then
            "$CARGO_HOME/bin/rustup" toolchain link solana "$PLATFORM_TOOLS_RUST" 2>&1 || true
          else
            echo "WARNING: No platform-tools rust found — cargo-build-sbf may use embedded rust"
          fi
          "$CARGO_HOME/bin/rustup" toolchain list || true
          cargo +solana --version 2>/dev/null || echo "solana toolchain link may have failed"

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "=== Decode wallet ==="
          if /tmp/solana-release/bin/solana-keygen pubkey <(echo "$WALLET_JSON") > /tmp/program-pubkey.txt 2>&1; then
            echo "Wallet: $(cat /tmp/program-pubkey.txt)"
            echo "$WALLET_JSON" > /tmp/wallet.json
          else
            echo "solana-keygen failed — Python decode"
            python3 -c "import os,json; k=json.loads(os.environ.get('WALLET_JSON','[]')); bytes(k).tofile(open('/tmp/wallet.json','wb')); open('/tmp/program-pubkey.txt','w').write(bytes(k)[32:].hex()+chr(10)); print('Wallet:',bytes(k)[32:].hex()[:8]+'...')"
          fi
          echo "Wallet decoded: $(head -c 8 /tmp/program-pubkey.txt)..."
      - name: Install solana-cargo-build-sbf v4.0.0 (Rust 1.89, supports edition2024 crates)
        run: |
          # Install v4.0.0 from crates.io — REQUIRES Rust 1.89 to build
          # Installs to /opt/cargo/bin/cargo-build-sbf (CARGO_HOME=/opt/cargo)
          cargo +1.89 install solana-cargo-build-sbf --version 4.0.0 2>&1 || \
            cargo +1.89 install solana-cargo-build-sbf 2>&1 || true
          echo "=== Installed cargo-build-sbf ==="
          /opt/cargo/bin/cargo-build-sbf --version 2>&1 || echo "Install may have failed"

      - name: Build program
        run: |
          export CARGO_HOME="/opt/cargo"
          export RUSTUP_HOME="/opt/rustup"
          export RUSTUP_TOOLCHAIN=1.89
          export PATH="/opt/cargo/bin:/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          echo "=== Rust toolchain ==="
          cargo --version || echo "cargo failed"
          which cargo
          echo ""
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs
          echo ""
          echo "=== Building with cargo build-sbf (RUSTUP_TOOLCHAIN=1.89) ==="
          cargo build-sbf 2>&1
          echo ""
          echo "=== Copy .so to expected path ==="
          SBF_OUT="target/sbpf-solana-solana/release/hub_evidence_anchor.so"
          DEPLOY_DIR="target/deploy"
          mkdir -p "$DEPLOY_DIR"
          if [ -f "$SBF_OUT" ]; then
            cp "$SBF_OUT" "$DEPLOY_DIR/hub_evidence_anchor.so"
            echo "Copied .so to $DEPLOY_DIR/"
          else
            SBF_ROOT="target/sbpf-solana-solana/release/hub_evidence_anchor.so"
            if [ -f "$SBF_ROOT" ]; then
              cp "$SBF_ROOT" "$DEPLOY_DIR/hub_evidence_anchor.so"
              echo "Copied .so from workspace root to $DEPLOY_DIR/"
            else
              echo "BUILD FAILED: No .so found"
              find . -name "hub_evidence_anchor.so" 2>/dev/null
              exit 1
            fi
          fi
          echo ""
          echo "=== Build artifacts ==="
          if [ -f target/deploy/hub_evidence_anchor.so ]; then
            echo "BUILD SUCCESS"
            ls -lh target/deploy/hub_evidence_anchor.so
          else
            echo "BUILD FAILED: No .so found"
            exit 1
          fi

      - name: Airdrop SOL to upgrade authority
        run: |
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          solana balance "$UPGRADE_AUTH" --url devnet
          for i in 1 2 3 4 5; do
            if solana airdrop 2 "$UPGRADE_AUTH" --url devnet 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"; break
            fi
            echo "Airdrop $i failed, retry..."
            sleep 3
          done
          solana balance "$UPGRADE_AUTH" --url devnet

      - name: Deploy program
        run: |
          solana program deploy \
            target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --program-id $PROGRAM_ID \
            --url devnet 2>&1

      - name: Verify
        run: |
          solana program show $PROGRAM_ID --url devnet
