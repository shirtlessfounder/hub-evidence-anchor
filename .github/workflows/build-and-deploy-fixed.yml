name: Build and Deploy (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOLANA_CLI_VERSION: "v1.18.6"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Install AVM and Anchor via npm
        run: |
          npm install -g @coral-xyz/anchor-cli@0.31.2
          echo "$(npm root -g)" >> $GITHUB_PATH
          anchor --version

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          secret = os.environ.get("WALLET_JSON", "").strip()
          raw = None
          if len(secret) == 88:
              n = 0
              for c in secret:
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
          elif secret.startswith('['):
              raw = bytes(json.loads(secret))
          else:
              raw = base64.b64decode(secret)
          with open("/tmp/wallet.json", "w") as f:
              json.dump([int(b) for b in raw], f)
          pub = raw[32:]
          n = int.from_bytes(pub, 'big')
          addr = ''
          while n > 0: n, rem = divmod(n, 58); addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/program-pubkey.txt", "w") as f:
              f.write(addr + "\n")
          PYEOF

      - name: Build program
        run: |
          # Verify the program ID in the source matches what we want to deploy to
          echo "=== Current program ID in lib.rs ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs
          
          echo ""
          echo "=== Target program ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf ==="
          
          # Build from repo ROOT (where Anchor.toml lives)
          # --locked ensures Cargo.lock is respected (newer deps on crates.io may require Rust 2024)
          anchor build --locked 2>&1 | tail -20
          
          echo ""
          echo "=== Build artifacts ==="
          SO_FILE=$(find . -name "hub_evidence_anchor.so" -path "*/target/deploy/*" 2>/dev/null | head -1)
          if [ -n "$SO_FILE" ]; then
            echo "BUILD SUCCESS: $SO_FILE"
            ls -lh "$SO_FILE"
          else
            echo "BUILD FAILED: No .so found"
            ls -la programs/hub-evidence-anchor/target/ 2>/dev/null || echo "No target dir"
            exit 1
          fi

      - name: Airdrop SOL to upgrade authority
        run: |
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          echo "Balance before airdrop:"
          solana balance "$UPGRADE_AUTH" --url devnet
          
          echo "Requesting airdrop..."
          for i in 1 2 3; do
            if solana airdrop 2 "$UPGRADE_AUTH" --url devnet 2>&1 | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            sleep 2
          done
          
          echo "Balance after airdrop:"
          solana balance "$UPGRADE_AUTH" --url devnet

      - name: Deploy program
        id: deploy
        run: |
          SO_FILE="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          echo "Deploying $SO_FILE"
          echo "Program ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf"
          
          solana program deploy \
            "$SO_FILE" \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url devnet 2>&1

      - name: Verify
        run: |
          echo "=== Program verification ==="
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet
