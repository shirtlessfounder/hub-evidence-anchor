name: Build and Deploy (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOLANA_CLI_VERSION: v3.1.12
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  PATH: /tmp/solana-release/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "Installed $(/tmp/solana-release/bin/solana --version)"

      - name: Install Rust 1.85 toolchain
        run: |
          # Install Rust 1.85 (edition2024 deps like toml_datetime require 1.85)
          export CARGO_HOME="/opt/cargo"
          export RUSTUP_HOME="/opt/rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          rm -rf "$CARGO_HOME" "$RUSTUP_HOME"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh -s -- -y --default-toolchain 1.85.0 --no-modify-path
          echo "Installed:"
          "$CARGO_HOME/bin/rustup" toolchain list

      - name: Install clang for BPF compilation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-14 llvm

      - name: Setup Solana BPF toolchain
        run: |
          export CARGO_HOME="/opt/cargo"
          export RUSTUP_HOME="/opt/rustup"
          export PATH="/tmp/solana-release/bin:$CARGO_HOME/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          ORIGINAL_DIR="$(pwd)"
          # cargo-build-sbf downloads platform-tools on first actual build; do a dummy build here to prime the cache
          echo "=== Priming platform-tools (dummy build) ==="
          mkdir -p /tmp/dummy-build
          cd /tmp/dummy-build
          /tmp/solana-release/bin/cargo-build-sbf --version 2>&1 || true
          rm -rf /tmp/dummy-build
          cd "$ORIGINAL_DIR"
          # Now find the cached platform-tools rust
          PLATFORM_TOOLS_RUST=$(find "$HOME/.cache/solana" -name "rustc" -path "*/platform-tools/*/rust/bin/rustc" 2>/dev/null | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || true)
          echo "Found platform-tools rust: $PLATFORM_TOOLS_RUST"
          if [ -n "$PLATFORM_TOOLS_RUST" ] && [ -d "$PLATFORM_TOOLS_RUST" ]; then
            rustup toolchain link solana "$PLATFORM_TOOLS_RUST" 2>&1 || true
          else
            echo "WARNING: No platform-tools rust found — cargo-build-sbf may use embedded rust"
          fi
          rustup toolchain list || true
          cargo +solana --version 2>/dev/null || echo "solana toolchain not available via rustup"

      - name: Decode wallet keypair (base64)
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$WALLET_JSON" | base64 -d > /tmp/wallet.json
          PUBKEY=$(/tmp/solana-release/bin/solana-keygen pubkey /tmp/wallet.json)
          echo "Wallet: $PUBKEY"
          echo "$PUBKEY" > /tmp/program-pubkey.txt

      - name: Build program
        run: |
          # SOURCE cargo env FIRST so cargo-build-sbf subprocess finds 'cargo metadata'
          source "$HOME/.cargo/env" 2>/dev/null || true
          export CARGO_HOME="/opt/cargo"
          export RUSTUP_HOME="/opt/rustup"
          export PATH="/opt/cargo/bin:$HOME/.cargo/bin:/tmp/solana-release/bin:$CARGO_HOME/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          
          # Verify cargo is available
          which cargo || (mkdir -p /usr/local/bin && ln -sf /opt/cargo/bin/cargo /usr/local/bin/cargo && echo "Created cargo symlink") || true
          
          # Tell cargo-build-sbf where to find cargo
          export CARGO="/opt/cargo/bin/cargo"
          echo "CARGO=$CARGO"
          ls -la "$CARGO" || echo "CARGO not found at $CARGO"
          
          rm -f Cargo.lock
          find . -name "Cargo.lock" -delete 2>/dev/null || true
          
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs
          
          echo ""
          echo "=== Toolchain check ==="
          /opt/cargo/bin/cargo +solana --version 2>&1 || echo "solana toolchain check failed"
          /opt/cargo/bin/rustup toolchain list 2>&1
          which cargo || echo "CARGO NOT IN PATH"
          
          echo ""
          echo "=== Building with cargo +solana build-sbf ==="
          /opt/cargo/bin/cargo +solana build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1
          
          echo ""
          echo "=== Copy .so to expected path ==="
          # cargo build-sbf outputs to target/sbf-solana-solana/release/ at the
          # manifest's Cargo.toml dir (workspace root when using --manifest-path).
          # Copy to programs/hub-evidence-anchor/target/deploy/ so deploy step finds it.
          SBF_OUT="programs/hub-evidence-anchor/target/sbf-solana-solana/release/hub_evidence_anchor.so"
          DEPLOY_DIR="programs/hub-evidence-anchor/target/deploy"
          mkdir -p "$DEPLOY_DIR"
          if [ -f "$SBF_OUT" ]; then
            cp "$SBF_OUT" "$DEPLOY_DIR/hub_evidence_anchor.so"
            echo "Copied .so to $DEPLOY_DIR/"
          else
            # Fallback: try workspace-root sbf path
            SBF_ROOT="target/sbf-solana-solana/release/hub_evidence_anchor.so"
            if [ -f "$SBF_ROOT" ]; then
              cp "$SBF_ROOT" "$DEPLOY_DIR/hub_evidence_anchor.so"
              echo "Copied .so from workspace root to $DEPLOY_DIR/"
            else
              echo "BUILD FAILED: No .so found at $SBF_OUT or $SBF_ROOT"
              find . -name "hub_evidence_anchor.so" 2>/dev/null
              exit 1
            fi
          fi
          
          echo ""
          echo "=== Build artifacts ==="
          if [ -f programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so ]; then
            echo "BUILD SUCCESS"
            ls -lh programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
          else
            echo "BUILD FAILED: No .so found"
            find programs/hub-evidence-anchor/target -name "*.so" 2>/dev/null || echo "No .so files found"
            exit 1
          fi

      - name: Airdrop SOL (Helius or Solana Foundation)
        run: |
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          solana balance "$UPGRADE_AUTH" --url https://api.devnet.solana.com
          
          if [ -n "${{ secrets.HELIUS_API_KEY }}" ]; then
            echo "Using Helius faucet..."
            curl -s -X POST "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"requestAirdrop\",\"params\":[\"$UPGRADE_AUTH\", 2000000000]}"
          else
            echo "Requesting from Solana Foundation faucet (10 retries)..."
            for i in $(seq 1 10); do
              result=$(solana airdrop 2 "$UPGRADE_AUTH" --url https://api.devnet.solana.com 2>&1)
              if echo "$result" | grep -q "Success"; then
                echo "Airdrop $i succeeded"
                break
              fi
              echo "Airdrop $i: $(echo $result | head -1)"
              sleep 3
            done
          fi
          
          solana balance "$UPGRADE_AUTH" --url https://api.devnet.solana.com

      - name: Deploy program
        run: |
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url https://api.devnet.solana.com 2>&1

      - name: Verify
        run: |
          /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url https://api.devnet.solana.com
