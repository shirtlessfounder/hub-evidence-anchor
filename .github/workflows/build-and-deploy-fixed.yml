name: Build and Deploy (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SOLANA_CLI_VERSION: v1.18.6
  PROGRAM_ID: spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf
  # Add Solana CLI + Rust toolchain (cargo lives here)
  PATH: /tmp/solana-release/bin:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${{ env.SOLANA_CLI_VERSION }}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar xj -C /tmp
          echo "Installed Solana CLI $(/tmp/solana-release/bin/solana --version)"

      - name: Install Rust + Solana toolchain
        run: |
          if ! command -v cargo &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env" 2>/dev/null || true
          # cargo-build-sbf uses 'cargo +solana' — install the Solana rustup toolchain
          # Channel 1.77 matches what Solana SBF toolchain historically shipped with
          rustup toolchain install 1.77.0
          rustup toolchain link solana /tmp/solana-release/bin/sdk/sbf/cargo
          rustup default solana
          echo "cargo: $(cargo +solana --version 2>/dev/null || cargo --version)"
          echo "rustc: $(rustc +solana --version 2>/dev/null || rustc --version)"

      - name: Decode wallet keypair (base64)
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          echo "$WALLET_JSON" | base64 -d > /tmp/wallet.json
          PUBKEY=$(/tmp/solana-release/bin/solana-keygen pubkey /tmp/wallet.json)
          echo "Wallet: $PUBKEY"
              for c in secret:
                  n = n * 58 + ALPHABET.index(c)
              raw = n.to_bytes(64, 'big')
          elif secret.startswith('['):
              raw = bytes(json.loads(secret))
          else:
              raw = base64.b64decode(secret)
          with open("/tmp/wallet.json", "w") as f:
              json.dump([int(b) for b in raw], f)
          pub = raw[32:]
          n = int.from_bytes(pub, 'big')
          addr = ''
          while n > 0: n, rem = divmod(n, 58); addr = ALPHABET[rem] + addr
          print(f"Wallet: {addr}")
          with open("/tmp/program-pubkey.txt", "w") as f:
              f.write(addr + "\n")
          PYEOF

      - name: Build program
        run: |
          # Add Solana CLI and Rust to PATH
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          
          # Remove ALL Cargo.lock files before build — cargo 1.94+ generates v4 format
          # which cargo-build-sbf's embedded cargo can't parse
          rm -f Cargo.lock
          find . -name "Cargo.lock" -delete 2>/dev/null || true
          
          echo "=== Program ID ==="
          grep declare_id programs/hub-evidence-anchor/src/lib.rs
          
          echo ""
          echo "=== Building with cargo-build-sbf ==="
          echo "cargo: $(which cargo) ($(cargo --version))"
          echo "rustc: $(which rustc) ($(rustc --version))"
          # Force cargo to skip lockfile write to avoid v4 format issues
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback \
            cargo-build-sbf --manifest-path programs/hub-evidence-anchor/Cargo.toml 2>&1
          
          echo ""
          echo "=== Build artifacts ==="
          if [ -f programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so ]; then
            echo "BUILD SUCCESS"
            ls -lh programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so
          else
            echo "BUILD FAILED: No .so found"
            ls -la programs/hub-evidence-anchor/target/ 2>/dev/null || echo "No target dir"
            exit 1
          fi

      - name: Airdrop SOL
        run: |
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          UPGRADE_AUTH=$(cat /tmp/program-pubkey.txt | tr -d '\n')
          echo "Upgrade authority: $UPGRADE_AUTH"
          solana balance "$UPGRADE_AUTH" --url devnet
          
          echo "Requesting airdrop..."
          for i in $(seq 1 5); do
            result=$(solana airdrop 2 "$UPGRADE_AUTH" --url devnet 2>&1)
            if echo "$result" | grep -q "Success"; then
              echo "Airdrop $i succeeded"
              break
            fi
            echo "Airdrop $i: $result"
            sleep 2
          done
          
          solana balance "$UPGRADE_AUTH" --url devnet

      - name: Deploy program
        run: |
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          RPC=https://api.devnet.solana.com
          solana program deploy \
            programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url $RPC 2>&1

      - name: Verify
        run: |
          export PATH="/tmp/solana-release/bin:$HOME/.cargo/bin:$PATH"
          solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url https://api.devnet.solana.com
