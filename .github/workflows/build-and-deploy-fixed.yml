on:
  push:
  workflow_dispatch:

name: Build and Deploy (Fixed)

permissions:
  contents: read
  attestations: write
  id-token: write

env:
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  RUSTUP_TOOLCHAIN: "1.85"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v3.1.12/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar jx
          mv solana-release /tmp/solana-release
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH

      - name: Setup Rust 1.85
        run: |
          mkdir -p /opt/cargo /opt/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.85.0 

      - name: Install Rust 1.89
        run: /opt/cargo/bin/rustup toolchain install 1.89.0  || true

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Decode wallet
        env:
          WALLET_JSON: ${{ secrets.ANCHOR_WALLET_JSON }}
        run: |
          if [ -z "$WALLET_JSON" ]; then
            echo "ERROR: ANCHOR_WALLET_JSON secret is empty! Check GitHub repo → Settings → Secrets → Actions."
            exit 1
          fi
          echo "$WALLET_JSON" > /tmp/wallet_secret.txt
          if /tmp/solana-release/bin/solana-keygen pubkey /tmp/wallet_secret.txt > /tmp/program-pubkey.txt 2>&1; then
            echo "Wallet via solana-keygen: $(cat /tmp/program-pubkey.txt)"
            cp /tmp/wallet_secret.txt /tmp/wallet.json
          else
            echo "solana-keygen failed — decode wallet via scripts/decode_wallet.py"
            python3 scripts/decode_wallet.py
          fi
          echo "Wallet ready: $(cat /tmp/program-pubkey.txt)"

      - name: Check balance
        run: /tmp/solana-release/bin/solana balance --keypair /tmp/wallet.json --url devnet

      - name: Close buffers
        run: /tmp/solana-release/bin/solana program close --buffers --keypair /tmp/wallet.json --url devnet || true

      - name: Airdrop SOL
        run: /tmp/solana-release/bin/solana airdrop 2 --keypair /tmp/wallet.json --url devnet || echo "Airdrop done"

      - name: Check balance after airdrop
        run: /tmp/solana-release/bin/solana balance --keypair /tmp/wallet.json --url devnet

      - name: Generate Cargo.lock
        run: |
          echo "=== Generate Cargo.lock ==="
          bash -lc 'cat > /tmp/gen_lock.py' << '''PYEOF'''
import subprocess, json, sys
try:
    result = subprocess.run(["cargo", "+1.89", "generate-lockfile", "--manifest-path", "programs/hub-evidence-anchor/Cargo.toml"],
                          capture_output=True, text=True, timeout=120)
    print("STDOUT:", result.stdout[:200])
    print("STDERR:", result.stderr[:200])
    if result.returncode == 0:
        print("SUCCESS: Cargo.lock generated")
        with open("programs/hub-evidence-anchor/Cargo.lock") as f:
            first = f.readline()
            print("Lockfile format:", first.strip())
    else:
        print("FAILED: cargo generate-lockfile returned", result.returncode)
        # Try workspace-level lockfile
        r2 = subprocess.run(["cargo", "+1.89", "generate-lockfile"],
                           capture_output=True, text=True, timeout=120)
        if r2.returncode == 0:
            print("SUCCESS: workspace Cargo.lock generated")
        else:
            print("STDERR:", r2.stderr[:300])
            sys.exit(1)
except Exception as e:
    print(f"ERROR: {e}")
    sys.exit(1)
PYEOF
          python3 /tmp/gen_lock.py

      - name: Build program
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export LD_LIBRARY_PATH="$CARGO_HOME/lib:$LD_LIBRARY_PATH"
          ~/.cargo/bin/cargo-build-sbf 2>&1

      - name: Copy artifact
        run: |
          SBF_OUT="target/sbpf-solana-solana/release/hub_evidence_anchor.so"
          DEPLOY_OUT="programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so"
          mkdir -p programs/hub-evidence-anchor/target/deploy
          if [ -f "$SBF_OUT" ]; then
            cp "$SBF_OUT" "$DEPLOY_OUT"
            echo "Copied from $SBF_OUT"
          elif [ -f "$DEPLOY_OUT" ]; then
            echo "Already at $DEPLOY_OUT"
          else
            echo "ERROR: No .so found"
            find . -name "*.so" 2>/dev/null
            exit 1
          fi
          ls -lh "$DEPLOY_OUT"

      - name: Deploy to devnet
        run: |
          /tmp/solana-release/bin/solana program deploy \
            programs/hub-evidence-anchor/target/deploy/hub_evidence_anchor.so \
            --keypair /tmp/wallet.json \
            --program-id spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf \
            --url devnet 2>&1

      - name: Verify
        run: /tmp/solana-release/bin/solana program show spJAH8mpJmzp6xf5fpfueaBsjRUbPjcmJJMTrfvW8cf --url devnet || echo "Done"
