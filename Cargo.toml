[workspace]
members = [
    "programs/hub-evidence-anchor"
]
resolver = "2"

[profile.release]
overflow-checks = true

# Force older transitive deps that require Rust 2024 edition
[patch.crates-io]
toml_edit = "=0.21.0"
blake3 = "=1.7.1"
ahash = { version = "=0.8.6", registry = "https://github.com/rust-lang/crates.io-index" }
