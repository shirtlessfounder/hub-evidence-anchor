[workspace]
members = [
    "programs/hub-evidence-anchor"
]
resolver = "2"

[profile.release]
overflow-checks = true

# Patch crates that jumped to edition 2024 (require Rust 1.85 minimum).
# cargo-build-sbf internally calls `cargo` which may be GitHub Actions' cargo 1.81,
# which cannot parse edition 2024 Cargo.toml manifests. Patches ensure compatible versions.
[patch.crates-io]
# pin sha2 -> digest 0.9 -> generic-array (avoids digest 0.11 -> block-buffer 0.12)
sha2 = "=0.9.9"
# block-buffer 0.12.x all require edition 2024 — pin to last edition 2021 version
block-buffer = "=0.11.0-rc.3"
# cpufeatures 0.3.x require edition 2024 — pin to last edition 2018 version
cpufeatures = "=0.2.17"
# hybrid-array 0.4.x require edition 2024 — pin to last edition 2021 version
hybrid-array = "=0.2.0"
