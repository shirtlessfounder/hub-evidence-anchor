[package]
name = "hub-evidence-anchor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
no-entrypoint = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
spl-token = "0.4.0"
borsh = "1.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
