[workspace]
members = [
    "programs/hub-evidence-anchor"
]
resolver = "2"

[profile.release]
overflow-checks = true


# Patch toml_edit to avoid Rust 2024 edition requirement
# toml_edit 0.25.x requires Rust 2024 edition which solana BPF toolchain doesn't support
[patch.crates-io]
toml_edit = { git = "https://github.com/toml-rs/toml", tag = "v0.21.0" }
