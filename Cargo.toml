[workspace]
members = [
    "programs/hub-evidence-anchor"
]
resolver = "2"

[profile.release]
overflow-checks = true

# Patch transitive deps to avoid Rust 2024 edition requirements
# block-buffer v0.12 requires edition 2024 which cargo 1.81 can't parse
[patch.crates-io]
block-buffer = { version = "=0.11.0" }
