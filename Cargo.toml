[workspace]
members = [
    "programs/hub-evidence-anchor"
]
resolver = "2"

[profile.release]
overflow-checks = true

# Pin block-buffer to 0.10.4 to avoid edition 2024 in 0.12 (saves ~69KB bytecode)
# NOTE: removed [patch.crates-io] - patches must point to a DIFFERENT source (git/path).
# block-buffer 0.10.4 only exists on crates.io, so patch was invalid.
# Cargo will resolve block-buffer based on direct dependency requirements.

# Fix bytecode bloat: blake3 1.5+ uses digest 0.11 -> block-buffer 0.12 -> generic-array 1.0 (huge)
# Patch blake3 to 1.4.x (last version using digest 0.10) via git tag
[patch.crates-io]
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.4.0" }
